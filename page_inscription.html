<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Créer un compte - Les studios a&amp;m</title>
    <link rel="icon" type="image/png" href="icon-192-lumiere.png">
    <link rel="shortcut icon" type="image/png" href="icon-192-lumiere.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F6F1E5">
    <link rel="apple-touch-icon" href="icon-192-lumiere.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="brand.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { text-align: center; }

        .page-logo { margin: 0 auto 1rem; }

        .signup-box {
            max-width: 320px;
            margin: 1rem auto;
        }

        .signup-box h1 {
            font-size: 1.3rem;
            text-align: center;
        }

        #message {
            font-size: 0.9rem;
            min-height: 1.2rem;
            text-align: center;
        }

        .login-link {
            font-size: 0.85rem;
            text-align: center;
            margin-top: 1rem;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: .75rem;
            margin: 1.25rem 0;
            color: var(--ink-muted);
            font-size: .82rem;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--line);
        }

        #googleSignupBtn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .6rem;
            width: 100%;
        }

        #googleSignupBtn svg { flex-shrink: 0; }
    </style>
</head>
<body>
    <img class="page-logo" src="icon-512-lumiere.png" alt="Logo des studios a&amp;m">

    <div class="signup-box card">
        <h1>Créer un compte</h1>

        <form id="signupForm">
            <label for="prenom">Prénom</label>
            <input id="prenom" type="text" autocomplete="given-name" required>

            <label for="nom">Nom</label>
            <input id="nom" type="text" autocomplete="family-name" required>

            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="username" required>

            <label for="password">Mot de passe (6 caractères minimum)</label>
            <input id="password" type="password" autocomplete="new-password" minlength="6" required>

            <button type="submit" id="submitBtn" class="btn-primary">Créer mon compte</button>
        </form>

        <div class="divider">ou</div>

        <button type="button" id="googleSignupBtn" class="btn">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
                <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
                <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
                <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
                <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
            </svg>
            Créer un compte avec Google
        </button>

        <p id="message" aria-live="polite"></p>

        <p class="login-link">Déjà un compte ? <a href="page_de_connexion.html">Se connecter</a></p>
    </div>

    <script>
        const SUPABASE_URL = "https://hcvwbvqkbgtmmjkjfhza.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjdndidnFrYmd0bW1qa2pmaHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTE2OTQsImV4cCI6MjA5OTE2NzY5NH0.0xEC7Ws9edaUkTDxfC_wvvGBjCbl9Y26VP15vtFsXAQ";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        (function () {
            try {
                let anonId = localStorage.getItem("am-visitor-id");
                if (!anonId) {
                    anonId = crypto.randomUUID();
                    localStorage.setItem("am-visitor-id", anonId);
                }
                sb.auth.getSession().then(({ data: { session } }) => {
                    sb.from("site_visits").insert({
                        user_id: session ? session.user.id : null,
                        anon_id: anonId,
                        page: location.pathname.replace(/^\//, "") || "index.html"
                    }).then(() => {});
                });
            } catch (e) {}
        })();

        document.getElementById("signupForm").addEventListener("submit", async (event) => {
            event.preventDefault();

            const prenom = document.getElementById("prenom").value.trim();
            const nom = document.getElementById("nom").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const messageEl = document.getElementById("message");
            const submitBtn = document.getElementById("submitBtn");

            submitBtn.disabled = true;
            submitBtn.textContent = "Création...";
            messageEl.textContent = "";

            const { data, error } = await sb.auth.signUp({
                email,
                password,
                options: { data: { prenom, nom } },
            });

            if (error) {
                messageEl.textContent = error.message || "Une erreur est survenue côté serveur (envoi de l'email). Réessaie dans un instant.";
                submitBtn.disabled = false;
                submitBtn.textContent = "Créer mon compte";
                return;
            }

            if (data.session) {
                window.location.href = "accueil.html";
            } else {
                messageEl.textContent = "Compte créé. Vérifie ta boîte mail pour confirmer, puis connecte-toi.";
                submitBtn.disabled = false;
                submitBtn.textContent = "Créer mon compte";
            }
        });

        document.getElementById("googleSignupBtn").addEventListener("click", async () => {
            const messageEl = document.getElementById("message");
            const { error } = await sb.auth.signInWithOAuth({
                provider: "google",
                options: { redirectTo: `${location.origin}/accueil.html` }
            });
            if (error) messageEl.textContent = error.message;
        });
    </script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js").catch(() => {});
        }
    </script>

    <script src="telephone.js"></script>

    <!-- Tawk.to -->
    <script type="text/javascript">
    var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
    Tawk_API.onLoad = function () { Tawk_API.minimize(); };
    (async function(){
        try {
            if (typeof sb !== "undefined") {
                const { data: { session } } = await sb.auth.getSession();
                if (session && session.user) {
                    const meta = session.user.user_metadata || {};
                    Tawk_API.visitor = {
                        name: (meta.prenom && meta.nom) ? `${meta.prenom} ${meta.nom}` : session.user.email,
                        email: session.user.email
                    };
                }
            }
        } catch (e) {}
    })();
    (function(){
    var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
    s1.async=true;
    s1.src='https://embed.tawk.to/6adca14d64a87f34797a15fb/1k5mtc5ur';
    s1.charset='UTF-8';
    s1.setAttribute('crossorigin','*');
    s0.parentNode.insertBefore(s1,s0);
    })();
    </script>
</body>
</html>
