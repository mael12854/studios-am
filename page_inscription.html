<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un compte - Les studios a&amp;m</title>
    <link rel="icon" type="image/png" href="icon-192-lumiere.png">
    <link rel="shortcut icon" type="image/png" href="icon-192-lumiere.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F6F1E5">
    <link rel="apple-touch-icon" href="icon-192-lumiere.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="brand.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { text-align: center; }

        .page-logo { margin: 0 auto 1rem; }

        .signup-box {
            max-width: 320px;
            margin: 1rem auto;
        }

        .signup-box h1 {
            font-size: 1.3rem;
            text-align: center;
        }

        #message {
            font-size: 0.9rem;
            min-height: 1.2rem;
            text-align: center;
        }

        .login-link {
            font-size: 0.85rem;
            text-align: center;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <img class="page-logo" src="icon-512-lumiere.png" alt="Logo des studios a&amp;m">

    <div class="signup-box card">
        <h1>Créer un compte</h1>

        <form id="signupForm">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="username" required>

            <label for="password">Mot de passe (6 caractères minimum)</label>
            <input id="password" type="password" autocomplete="new-password" minlength="6" required>

            <button type="submit" id="submitBtn" class="btn-primary">Créer mon compte</button>
        </form>

        <p id="message" aria-live="polite"></p>

        <p class="login-link">Déjà un compte ? <a href="page_de_connexion.html">Se connecter</a></p>
    </div>

    <script>
        const SUPABASE_URL = "https://hcvwbvqkbgtmmjkjfhza.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjdndidnFrYmd0bW1qa2pmaHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTE2OTQsImV4cCI6MjA5OTE2NzY5NH0.0xEC7Ws9edaUkTDxfC_wvvGBjCbl9Y26VP15vtFsXAQ";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById("signupForm").addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const messageEl = document.getElementById("message");
            const submitBtn = document.getElementById("submitBtn");

            submitBtn.disabled = true;
            submitBtn.textContent = "Création...";
            messageEl.textContent = "";

            const { data, error } = await sb.auth.signUp({ email, password });

            if (error) {
                messageEl.textContent = error.message || "Une erreur est survenue côté serveur (envoi de l'email). Réessaie dans un instant.";
                submitBtn.disabled = false;
                submitBtn.textContent = "Créer mon compte";
                return;
            }

            if (data.session) {
                window.location.href = "accueil.html";
            } else {
                messageEl.textContent = "Compte créé. Vérifie ta boîte mail pour confirmer, puis connecte-toi.";
                submitBtn.disabled = false;
                submitBtn.textContent = "Créer mon compte";
            }
        });
    </script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js").catch(() => {});
        }
    </script>
</body>
</html>
