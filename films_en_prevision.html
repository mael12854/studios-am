<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Films en prévision - Les studios a&amp;m</title>
    <link rel="icon" type="image/png" href="icon-192-lumiere.png">
    <link rel="shortcut icon" type="image/png" href="icon-192-lumiere.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F6F1E5">
    <link rel="apple-touch-icon" href="icon-192-lumiere.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="brand.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { text-align: center; }

        .page-logo { margin-left: auto; margin-right: auto; }

        .grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
            max-width: 60rem;
            margin: 1.5rem auto;
        }

        .film-card {
            width: 100%;
            max-width: 420px;
        }

        .film-card h2 { text-align: center; font-size: 1.2rem; }

        .film-card .badge { display: block; width: fit-content; margin: 0 auto .75rem; }

        .poster {
            width: 100%;
            max-width: 220px;
            height: auto;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            display: block;
            margin: 0 auto 1rem;
        }

        .reservation {
            margin-top: .75rem;
            padding-top: .75rem;
            border-top: 1px solid var(--line);
        }

        .reservation .hint {
            font-size: .85rem;
            color: var(--ink-muted);
            margin: 0;
        }

        .reservation .reserve-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
        }

        .reservation input[type="number"] {
            width: 4.5rem;
            margin-bottom: 0;
            text-align: center;
        }

        .reservation .reserve-msg {
            font-size: .85rem;
            color: var(--ink-muted);
            margin: .5rem 0 0;
        }
    </style>
</head>
<body>
    <img class="page-logo" src="icon-512-lumiere.png" alt="Logo des studios a&amp;m">

    <h2>Films en prévision</h2>
    <p class="empty-hint">Bientôt à l'affiche.</p>

    <div id="filmsList" class="grid">
        <p>Chargement...</p>
    </div>

    <a class="btn back" href="accueil.html">Retour à l'accueil</a>

    <div id="a11y-widget">
        <button id="a11yToggle" aria-label="Options d'accessibilité" title="Options d'accessibilité">♿</button>
        <div id="a11yPanel" aria-hidden="true">
            <button id="fontIncrease" aria-label="Agrandir le texte">A+</button>
            <button id="fontDecrease" aria-label="Réduire le texte">A-</button>
            <button id="contrastToggle" aria-label="Activer le contraste élevé">Contraste élevé</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://hcvwbvqkbgtmmjkjfhza.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjdndidnFrYmd0bW1qa2pmaHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTE2OTQsImV4cCI6MjA5OTE2NzY5NH0.0xEC7Ws9edaUkTDxfC_wvvGBjCbl9Y26VP15vtFsXAQ";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str ?? "";
            return div.innerHTML;
        }

        function formatDateFR(isoDate) {
            if (!isoDate) return null;
            const d = new Date(isoDate + "T00:00:00");
            return d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
        }

        function formatPrice(num) {
            return Number(num).toFixed(2).replace(".", ",") + " €";
        }

        function reservationWindow(isoDate) {
            if (!isoDate) return null;
            const eventDate = new Date(isoDate + "T00:00:00");
            const opensAt = new Date(eventDate);
            opensAt.setMonth(opensAt.getMonth() - 3);
            const now = new Date();
            now.setHours(0, 0, 0, 0);
            return { eventDate, opensAt, isOpen: now >= opensAt && now <= eventDate };
        }

        function reservationBlock(article, userId) {
            const win = reservationWindow(article.date_representation);
            if (!win) return "";

            if (!win.isOpen) {
                const opensAtLabel = win.opensAt.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
                return `<div class="reservation"><p class="hint">Réservations ouvertes à partir du ${opensAtLabel}.</p></div>`;
            }

            if (!userId) {
                return `<div class="reservation"><p class="hint"><a href="page_de_connexion.html">Connectez-vous</a> pour réserver des places.</p></div>`;
            }

            return `
                <div class="reservation">
                    <div class="reserve-row">
                        <input type="number" min="1" value="1" data-qty-for="${article.id}" aria-label="Nombre de places">
                        <button type="button" class="btn" data-reserve-btn="${article.id}" data-unit-price="${article.prix}">Réserver</button>
                    </div>
                    <p class="reserve-msg" data-reserve-msg="${article.id}"></p>
                </div>
            `;
        }

        async function loadFilms() {
            const container = document.getElementById("filmsList");

            const { data: { session } } = await sb.auth.getSession();
            const userId = session ? session.user.id : null;

            const { data, error } = await sb
                .from("articles")
                .select("*")
                .eq("category", "film")
                .eq("status", "prevision")
                .order("created_at", { ascending: false });

            if (error) {
                container.innerHTML = "<p>Impossible de charger les films pour le moment.</p>";
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = "<p>Rien pour l'instant, revenez bientôt.</p>";
                return;
            }

            container.innerHTML = data.map(film => `
                <div class="film-card card">
                    <span class="badge prevision"><span class="dot"></span>En prévision</span>
                    ${film.image_url ? `<img class="poster" src="${escapeHtml(film.image_url)}" alt="Affiche de ${escapeHtml(film.title)}">` : ""}
                    <h2>${escapeHtml(film.title)}</h2>
                    <p>${film.description ? escapeHtml(film.description) : ""}</p>
                    ${film.date_representation ? `<p><strong>1ère représentation :</strong> ${escapeHtml(formatDateFR(film.date_representation))}</p>` : ""}
                    <p><strong>${escapeHtml(formatPrice(film.prix))}</strong> la place</p>
                    ${film.trailer_url ? `<a class="btn" href="cellule_cinema.html?id=${encodeURIComponent(film.id)}">Bande-Annonce</a>` : ""}
                    ${reservationBlock(film, userId)}
                </div>
            `).join("");

            data.forEach(film => {
                sb.rpc("increment_views", { article_id: film.id });
            });

            container.querySelectorAll("[data-reserve-btn]").forEach(btn => {
                btn.addEventListener("click", async () => {
                    const articleId = btn.dataset.reserveBtn;
                    const unitPrice = parseFloat(btn.dataset.unitPrice);
                    const qtyInput = container.querySelector(`input[data-qty-for="${articleId}"]`);
                    const msgEl = container.querySelector(`[data-reserve-msg="${articleId}"]`);
                    const quantity = Math.max(1, parseInt(qtyInput.value) || 1);

                    btn.disabled = true;
                    btn.textContent = "Réservation...";

                    const { error } = await sb.from("ticket_reservations").insert({
                        article_id: articleId,
                        user_id: userId,
                        quantity,
                        unit_price: unitPrice
                    });

                    if (error) {
                        msgEl.textContent = "Erreur : " + error.message;
                        btn.disabled = false;
                        btn.textContent = "Réserver";
                    } else {
                        const total = formatPrice(quantity * unitPrice);
                        msgEl.textContent = `${quantity} place(s) réservée(s). Prévoyez ${total} en liquide, à régler sur place avant la séance.`;
                        btn.textContent = "Réserver";
                        btn.disabled = false;
                    }
                });
            });
        }

        loadFilms();

        (function () {
            const toggle = document.getElementById('a11yToggle');
            const panel = document.getElementById('a11yPanel');
            const fontIncrease = document.getElementById('fontIncrease');
            const fontDecrease = document.getElementById('fontDecrease');
            const contrastToggle = document.getElementById('contrastToggle');

            let fontSize = parseInt(localStorage.getItem('a11y-fontSize')) || 100;
            let highContrast = localStorage.getItem('a11y-contrast') === 'true';

            function applySettings() {
                document.documentElement.style.fontSize = fontSize + '%';
                document.body.classList.toggle('high-contrast', highContrast);
            }
            applySettings();

            toggle.addEventListener('click', () => {
                const isActive = panel.classList.toggle('active');
                panel.setAttribute('aria-hidden', String(!isActive));
            });

            fontIncrease.addEventListener('click', () => {
                fontSize = Math.min(fontSize + 10, 150);
                localStorage.setItem('a11y-fontSize', fontSize);
                applySettings();
            });

            fontDecrease.addEventListener('click', () => {
                fontSize = Math.max(fontSize - 10, 80);
                localStorage.setItem('a11y-fontSize', fontSize);
                applySettings();
            });

            contrastToggle.addEventListener('click', () => {
                highContrast = !highContrast;
                localStorage.setItem('a11y-contrast', highContrast);
                applySettings();
            });
        })();
    </script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js").catch(() => {});
        }
    </script>

    <!-- Tawk.to -->
    <script type="text/javascript">
    var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
    (async function(){
        try {
            if (typeof sb !== "undefined") {
                const { data: { session } } = await sb.auth.getSession();
                if (session && session.user) {
                    const meta = session.user.user_metadata || {};
                    Tawk_API.visitor = {
                        name: (meta.prenom && meta.nom) ? `${meta.prenom} ${meta.nom}` : session.user.email,
                        email: session.user.email
                    };
                }
            }
        } catch (e) {}
    })();
    (function(){
    var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
    s1.async=true;
    s1.src='https://embed.tawk.to/6adca14d64a87f34797a15fb/1k5mtc5ur';
    s1.charset='UTF-8';
    s1.setAttribute('crossorigin','*');
    s0.parentNode.insertBefore(s1,s0);
    })();
    </script>
</body>
</html>
