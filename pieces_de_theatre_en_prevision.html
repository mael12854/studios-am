<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Les prochaines pièces de théâtre des studios A&amp;M, bientôt sur scène.">
    <title>Pièces de théâtre en prévision - Les studios a&amp;m</title>
    <link rel="icon" type="image/png" href="icon-192-lumiere.png">
    <link rel="shortcut icon" type="image/png" href="icon-192-lumiere.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F6F1E5">
    <link rel="apple-touch-icon" href="icon-192-lumiere.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="brand.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { text-align: center; }

        .page-logo { margin-left: auto; margin-right: auto; }

        .grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
            max-width: 60rem;
            margin: 1.5rem auto;
        }

        .film-card {
            width: 100%;
            max-width: 420px;
        }

        .film-card h2 { text-align: center; font-size: 1.2rem; }

        .film-card .badge { display: block; width: fit-content; margin: 0 auto .75rem; }

        .poster {
            width: 100%;
            max-width: 220px;
            height: auto;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            display: block;
            margin: 0 auto 1rem;
        }

        .reservation {
            margin-top: .75rem;
            padding-top: .75rem;
            border-top: 1px solid var(--line);
        }

        .reservation .hint {
            font-size: .85rem;
            color: var(--ink-muted);
            margin: 0;
        }

        .reservation .reserve-row {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 1rem;
            margin-bottom: .5rem;
        }

        .reservation .qty-label {
            display: flex;
            flex-direction: column;
            gap: .25rem;
            font-size: .78rem;
            color: var(--ink-muted);
        }

        .reservation input[type="number"] {
            width: 4.5rem;
            margin-bottom: 0;
            text-align: center;
        }

        .reservation .reserve-msg {
            font-size: .85rem;
            color: var(--ink-muted);
            margin: .5rem 0 0;
        }
    </style>
</head>
<body>
    <img class="page-logo" src="icon-512-lumiere.png" alt="Logo des studios a&amp;m">

    <h2>Pièces de théâtre en prévision</h2>
    <p class="empty-hint">Bientôt sur scène.</p>

    <div id="piecesList" class="grid">
        <p>Chargement...</p>
    </div>

    <a class="btn back" href="accueil.html">Retour à l'accueil</a>
    <a class="btn" id="cartLink" href="panier.html">Panier</a>

    <div id="a11y-widget">
        <button id="a11yToggle" aria-label="Options d'accessibilité" title="Options d'accessibilité">♿</button>
        <div id="a11yPanel" aria-hidden="true">
            <button id="fontIncrease" aria-label="Agrandir le texte">A+</button>
            <button id="fontDecrease" aria-label="Réduire le texte">A-</button>
            <button id="contrastToggle" aria-label="Activer le contraste élevé">Contraste élevé</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://hcvwbvqkbgtmmjkjfhza.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjdndidnFrYmd0bW1qa2pmaHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTE2OTQsImV4cCI6MjA5OTE2NzY5NH0.0xEC7Ws9edaUkTDxfC_wvvGBjCbl9Y26VP15vtFsXAQ";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str ?? "";
            return div.innerHTML;
        }

        function formatDateFR(isoDate) {
            if (!isoDate) return null;
            const d = new Date(isoDate + "T00:00:00");
            return d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
        }

        function formatPrice(num) {
            return Number(num).toFixed(2).replace(".", ",") + " €";
        }

        const CART_KEY = "am-cart";

        function getCart() {
            try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; } catch (e) { return []; }
        }

        function saveCart(cart) {
            localStorage.setItem(CART_KEY, JSON.stringify(cart));
        }

        function addToCart(item) {
            const cart = getCart();
            const existing = cart.find(i => i.article_id === item.article_id);
            if (existing) {
                existing.quantity = item.quantity;
                existing.minors = item.minors;
            } else {
                cart.push(item);
            }
            saveCart(cart);
            updateCartLink();
        }

        function updateCartLink() {
            const link = document.getElementById("cartLink");
            if (!link) return;
            const count = getCart().reduce((sum, i) => sum + i.quantity, 0);
            link.textContent = count > 0 ? `Panier (${count})` : "Panier";
        }

        function reservationWindow(isoDate) {
            if (!isoDate) return null;
            const eventDate = new Date(isoDate + "T00:00:00");
            const opensAt = new Date(eventDate);
            opensAt.setMonth(opensAt.getMonth() - 3);
            const now = new Date();
            now.setHours(0, 0, 0, 0);
            return { eventDate, opensAt, isOpen: now >= opensAt && now <= eventDate };
        }

        function reservationBlock(article, userId, isAdmin) {
            if (isAdmin) return "";

            const win = reservationWindow(article.date_representation);
            if (!win) return "";

            if (!win.isOpen) {
                const opensAtLabel = win.opensAt.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
                return `<div class="reservation"><p class="hint">Réservations ouvertes à partir du ${opensAtLabel}.</p></div>`;
            }

            if (!userId) {
                return `<div class="reservation"><p class="hint"><a href="page_de_connexion.html">Connectez-vous</a> pour réserver des places.</p></div>`;
            }

            return `
                <div class="reservation">
                    <div class="reserve-row">
                        <label class="qty-label">Places
                            <input type="number" min="1" value="1" data-qty-for="${article.id}" aria-label="Nombre de places">
                        </label>
                        <label class="qty-label">Mineurs (gratuit)
                            <input type="number" min="0" value="0" data-minors-for="${article.id}" aria-label="Nombre de places mineurs">
                        </label>
                    </div>
                    <button type="button" class="btn" data-add-cart="${article.id}" data-unit-price="${article.prix}" data-title="${escapeHtml(article.title)}">Ajouter au panier</button>
                    <p class="reserve-msg" data-reserve-msg="${article.id}"></p>
                </div>
            `;
        }

        async function loadPieces() {
            const container = document.getElementById("piecesList");

            const { data: { session } } = await sb.auth.getSession();
            const userId = session ? session.user.id : null;
            const { data: isAdmin } = await sb.rpc("is_admin");

            const cartLink = document.getElementById("cartLink");
            if (cartLink) {
                if (isAdmin) {
                    cartLink.style.display = "none";
                } else {
                    updateCartLink();
                }
            }

            const { data, error } = await sb
                .from("articles")
                .select("*")
                .eq("category", "piece")
                .eq("status", "prevision")
                .order("created_at", { ascending: false });

            if (error) {
                container.innerHTML = "<p>Impossible de charger les pièces pour le moment.</p>";
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = "<p>Rien pour l'instant, revenez bientôt.</p>";
                return;
            }

            container.innerHTML = data.map(piece => `
                <div class="film-card card">
                    <span class="badge prevision"><span class="dot"></span>En prévision</span>
                    ${piece.image_url ? `<img class="poster" src="${escapeHtml(piece.image_url)}" alt="Affiche de ${escapeHtml(piece.title)}">` : ""}
                    <h2>${escapeHtml(piece.title)}</h2>
                    <p>${piece.description ? escapeHtml(piece.description) : ""}</p>
                    ${piece.date_representation ? `<p><strong>Date :</strong> ${escapeHtml(formatDateFR(piece.date_representation))}</p>` : ""}
                    ${piece.lieu ? `<p><strong>Lieu :</strong> ${escapeHtml(piece.lieu)}</p>` : ""}
                    <p><strong>${escapeHtml(formatPrice(piece.prix))}</strong> la place</p>
                    ${reservationBlock(piece, userId, isAdmin)}
                </div>
            `).join("");

            data.forEach(piece => {
                sb.rpc("increment_views", { article_id: piece.id });
            });

            container.querySelectorAll("[data-add-cart]").forEach(btn => {
                btn.addEventListener("click", () => {
                    const articleId = btn.dataset.addCart;
                    const unitPrice = parseFloat(btn.dataset.unitPrice);
                    const title = btn.dataset.title;
                    const qtyInput = container.querySelector(`input[data-qty-for="${articleId}"]`);
                    const minorsInput = container.querySelector(`input[data-minors-for="${articleId}"]`);
                    const msgEl = container.querySelector(`[data-reserve-msg="${articleId}"]`);

                    const quantity = Math.max(1, parseInt(qtyInput.value) || 1);
                    let minors = Math.max(0, parseInt(minorsInput.value) || 0);
                    if (minors > quantity) minors = quantity;

                    addToCart({ article_id: articleId, title, unit_price: unitPrice, quantity, minors });
                    msgEl.textContent = "Ajouté au panier.";
                });
            });
        }

        loadPieces();

        (function () {
            const toggle = document.getElementById('a11yToggle');
            const panel = document.getElementById('a11yPanel');
            const fontIncrease = document.getElementById('fontIncrease');
            const fontDecrease = document.getElementById('fontDecrease');
            const contrastToggle = document.getElementById('contrastToggle');

            let fontSize = parseInt(localStorage.getItem('a11y-fontSize')) || 100;
            let highContrast = localStorage.getItem('a11y-contrast') === 'true';

            function applySettings() {
                document.documentElement.style.fontSize = fontSize + '%';
                document.body.classList.toggle('high-contrast', highContrast);
            }
            applySettings();

            toggle.addEventListener('click', () => {
                const isActive = panel.classList.toggle('active');
                panel.setAttribute('aria-hidden', String(!isActive));
            });

            fontIncrease.addEventListener('click', () => {
                fontSize = Math.min(fontSize + 10, 150);
                localStorage.setItem('a11y-fontSize', fontSize);
                applySettings();
            });

            fontDecrease.addEventListener('click', () => {
                fontSize = Math.max(fontSize - 10, 80);
                localStorage.setItem('a11y-fontSize', fontSize);
                applySettings();
            });

            contrastToggle.addEventListener('click', () => {
                highContrast = !highContrast;
                localStorage.setItem('a11y-contrast', highContrast);
                applySettings();
            });
        })();
    </script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js").catch(() => {});
        }
    </script>

    <!-- Tawk.to -->

                        email: session.user.email

        } catch (e) {}

    </script>
</body>
</html>
