<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Les studios a&amp;m</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #1c1f26;
            font-family: Arial, sans-serif;
            color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            background: #262a33;
            padding: 2rem;
            border-radius: 10px;
            width: 320px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }

        h1 {
            font-size: 1.3rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }

        input {
            width: 100%;
            padding: 0.6rem;
            margin-bottom: 1rem;
            box-sizing: border-box;
            border: 1px solid #444;
            border-radius: 6px;
            background: #1c1f26;
            color: #f0f0f0;
        }

        button {
            width: 100%;
            padding: 0.7rem;
            background-color: #6EA9FB;
            color: #1c1f26;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #5a94e0;
        }

        button:disabled {
            background-color: #3a4150;
            cursor: not-allowed;
        }

        #message {
            font-size: 0.9rem;
            min-height: 1.2rem;
            text-align: center;
            margin-top: 1rem;
        }

        .info {
            font-size: 0.75rem;
            color: #999;
            text-align: center;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🔐 Espace développeur — Les studios a&amp;m</h1>

        <form id="loginForm">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="username" required>

            <label for="password">Mot de passe</label>
            <input id="password" type="password" autocomplete="current-password" required>

            <button type="submit" id="submitBtn">Se connecter</button>
        </form>

        <p id="message" aria-live="polite"></p>
    </div>

    <script>
        const SUPABASE_URL = "https://hcvwbvqkbgtmmjkjfhza.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjdndidnFrYmd0bW1qa2pmaHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTE2OTQsImV4cCI6MjA5OTE2NzY5NH0.0xEC7Ws9edaUkTDxfC_wvvGBjCbl9Y26VP15vtFsXAQ";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Si déjà connecté, aller directement au dashboard
        (async () => {
            const { data: { session } } = await sb.auth.getSession();
            if (session) window.location.href = "dashboard.html";
        })();

        document.getElementById("loginForm").addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const messageEl = document.getElementById("message");
            const submitBtn = document.getElementById("submitBtn");

            submitBtn.disabled = true;
            submitBtn.textContent = "Connexion...";
            messageEl.textContent = "";

            const { error } = await sb.auth.signInWithPassword({ email, password });

            if (error) {
                messageEl.textContent = "❌ " + (error.message === "Invalid login credentials" ? "Identifiants incorrects" : error.message);
                submitBtn.disabled = false;
                submitBtn.textContent = "Se connecter";
            } else {
                window.location.href = "dashboard.html";
            }
        });
    </script>
</body>
</html>
