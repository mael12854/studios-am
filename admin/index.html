<!DOCTYPE html>
<html lang="fr" data-theme="nuit">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Les studios a&amp;m</title>
    <link rel="icon" type="image/png" href="../icon-192.png">
    <link rel="shortcut icon" type="image/png" href="../icon-192.png">
    <link rel="apple-touch-icon" href="../icon-192.png">
    <meta name="theme-color" content="#161513">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../brand.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-box { width: 320px; }

        .login-box h1 {
            font-size: 1.15rem;
            text-align: center;
        }

        button[type="submit"] { width: 100%; }

        #message {
            font-size: 0.9rem;
            min-height: 1.2rem;
            text-align: center;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-box card">
        <h1>Espace développeur — Les studios a&amp;m</h1>

        <form id="loginForm">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="username" required>

            <label for="password">Mot de passe</label>
            <input id="password" type="password" autocomplete="current-password" required>

            <button type="submit" id="submitBtn" class="btn-primary">Se connecter</button>
        </form>

        <p id="message" aria-live="polite"></p>
    </div>

    <script>
        const SUPABASE_URL = "https://hcvwbvqkbgtmmjkjfhza.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjdndidnFrYmd0bW1qa2pmaHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTE2OTQsImV4cCI6MjA5OTE2NzY5NH0.0xEC7Ws9edaUkTDxfC_wvvGBjCbl9Y26VP15vtFsXAQ";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Si déjà connecté, aller directement au dashboard
        (async () => {
            const { data: { session } } = await sb.auth.getSession();
            if (session) window.location.href = "dashboard.html";
        })();

        document.getElementById("loginForm").addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const messageEl = document.getElementById("message");
            const submitBtn = document.getElementById("submitBtn");

            submitBtn.disabled = true;
            submitBtn.textContent = "Connexion...";
            messageEl.textContent = "";

            const { error } = await sb.auth.signInWithPassword({ email, password });

            if (error) {
                messageEl.textContent = error.message === "Invalid login credentials" ? "Identifiants incorrects." : error.message;
                submitBtn.disabled = false;
                submitBtn.textContent = "Se connecter";
            } else {
                window.location.href = "dashboard.html";
            }
        });
    </script>
</body>
</html>
