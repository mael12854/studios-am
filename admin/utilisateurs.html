<!DOCTYPE html>
<html lang="fr" data-theme="nuit">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tous les comptes - Les studios a&amp;m</title>
    <link rel="icon" type="image/png" href="../icon-192.png">
    <link rel="shortcut icon" type="image/png" href="../icon-192.png">
    <link rel="apple-touch-icon" href="../icon-192.png">
    <meta name="theme-color" content="#161513">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../brand.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        header h1 { margin: 0; font-size: 1.3rem; }
        header nav { display: flex; gap: .75rem; flex-wrap: wrap; }
        header nav a, header nav button { text-decoration: none; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        th, td {
            text-align: left;
            padding: .75rem 1rem;
            border-bottom: 1px solid var(--line);
            font-size: .92rem;
        }

        th {
            font-family: var(--font-mono);
            background: var(--surface-alt);
            color: var(--ink-muted);
            font-size: .72rem;
            letter-spacing: .05em;
            text-transform: uppercase;
        }

        .actions-cell { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }

        .avatar-cell img, .avatar-cell .avatar-placeholder {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            background: var(--surface-alt);
            border: 1px solid var(--line);
        }

        .status-badge {
            font-family: var(--font-mono);
            font-size: .72rem;
            letter-spacing: .03em;
            padding: .15rem .55rem;
            border-radius: 999px;
            border: 1px solid var(--line);
            white-space: nowrap;
        }

        .status-valide { color: #4caf7d; border-color: #4caf7d; }
        .status-refuse { color: #e06a6a; border-color: #e06a6a; }
        .status-attente { color: var(--gold); border-color: var(--gold); }

        #message {
            font-size: .9rem;
            margin-bottom: 1rem;
            min-height: 1.2rem;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--ink-muted);
        }

        .search-bar { margin-bottom: 1rem; }
        .search-bar input { max-width: 320px; }

        @media (max-width: 700px) {
            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; }
            td { border-bottom: none; padding: .4rem 1rem; }
            tr { border-bottom: 1px solid var(--line); padding: .75rem 0; }
            td::before {
                content: attr(data-label);
                font-family: var(--font-mono);
                font-weight: 600;
                color: var(--ink-muted);
                display: block;
                font-size: .72rem;
                text-transform: uppercase;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Tous les comptes</h1>
        <nav>
            <a class="btn" href="dashboard.html">← Tableau de bord</a>
            <button class="btn" id="logoutBtn">Se déconnecter</button>
        </nav>
    </header>

    <div class="search-bar">
        <input type="search" id="searchInput" placeholder="Rechercher un nom ou un email...">
    </div>

    <p id="message" aria-live="polite">Chargement...</p>

    <table>
        <thead>
            <tr>
                <th></th>
                <th>Nom</th>
                <th>Email</th>
                <th>Statut</th>
                <th>Inscrit le</th>
                <th>Avatar</th>
            </tr>
        </thead>
        <tbody id="comptesBody">
            <tr><td colspan="6">Chargement...</td></tr>
        </tbody>
    </table>

    <input type="file" id="avatarFileInput" accept="image/*" style="display:none">

    <script>
        const SUPABASE_URL = "https://hcvwbvqkbgtmmjkjfhza.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjdndidnFrYmd0bW1qa2pmaHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTE2OTQsImV4cCI6MjA5OTE2NzY5NH0.0xEC7Ws9edaUkTDxfC_wvvGBjCbl9Y26VP15vtFsXAQ";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const messageEl = document.getElementById("message");
        let allComptes = [];
        let pendingAvatarUserId = null;

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str ?? "";
            return div.innerHTML;
        }

        function formatDateFR(iso) {
            return new Date(iso).toLocaleString("fr-FR", { dateStyle: "long", timeStyle: "short" });
        }

        function statusBadge(p) {
            if (p.refuse) return `<span class="status-badge status-refuse">Refusé</span>`;
            if (p.valide) return `<span class="status-badge status-valide">Validé</span>`;
            return `<span class="status-badge status-attente">En attente</span>`;
        }

        document.getElementById("logoutBtn").addEventListener("click", async () => {
            await sb.auth.signOut();
            window.location.href = "index.html";
        });

        (async () => {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) { window.location.href = "index.html"; return; }

            const { data: isAdmin } = await sb.rpc("is_admin");
            if (!isAdmin) { await sb.auth.signOut(); window.location.href = "index.html"; return; }

            loadComptes();
        })();

        async function loadComptes() {
            const { data: profiles, error } = await sb
                .from("profiles")
                .select("id, valide, refuse, created_at")
                .order("created_at", { ascending: false });

            if (error) {
                messageEl.textContent = "Erreur : " + error.message;
                return;
            }

            if (!profiles || profiles.length === 0) {
                messageEl.textContent = "";
                allComptes = [];
                renderComptes([]);
                return;
            }

            const { data: userInfos } = await sb.rpc("get_user_profiles", { user_ids: profiles.map(p => p.id) });
            const infoMap = {};
            (userInfos || []).forEach(info => { infoMap[info.id] = info; });

            allComptes = profiles.map(p => ({ ...p, info: infoMap[p.id] }));
            messageEl.textContent = "";
            renderComptes(allComptes);
        }

        function renderComptes(list) {
            const tbody = document.getElementById("comptesBody");

            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="empty-state">Aucun compte trouvé.</td></tr>`;
                return;
            }

            tbody.innerHTML = list.map(p => {
                const info = p.info;
                const nom = info && info.prenom && info.nom ? `${info.prenom} ${info.nom}` : "—";
                const email = info ? info.email : p.id;
                const avatar = info && info.avatar_url
                    ? `<img src="${escapeHtml(info.avatar_url)}" alt="" loading="lazy">`
                    : `<span class="avatar-placeholder"></span>`;
                return `
                    <tr data-id="${p.id}">
                        <td data-label="" class="avatar-cell">${avatar}</td>
                        <td data-label="Nom">${escapeHtml(nom)}</td>
                        <td data-label="Email">${escapeHtml(email)}</td>
                        <td data-label="Statut">${statusBadge(p)}</td>
                        <td data-label="Inscrit le">${escapeHtml(formatDateFR(p.created_at))}</td>
                        <td data-label="Avatar" class="actions-cell">
                            <button class="btn" data-action="changer" data-id="${p.id}">Changer</button>
                            ${info && info.avatar_url ? `<button class="btn btn-danger" data-action="retirer" data-id="${p.id}">Retirer</button>` : ""}
                        </td>
                    </tr>
                `;
            }).join("");

            tbody.querySelectorAll("[data-action='changer']").forEach(btn => {
                btn.addEventListener("click", () => {
                    pendingAvatarUserId = btn.dataset.id;
                    document.getElementById("avatarFileInput").click();
                });
            });
            tbody.querySelectorAll("[data-action='retirer']").forEach(btn => {
                btn.addEventListener("click", () => resetAvatar(btn.dataset.id));
            });
        }

        document.getElementById("avatarFileInput").addEventListener("change", async (event) => {
            const file = event.target.files[0];
            event.target.value = "";
            if (!file || !pendingAvatarUserId) return;
            await uploadAvatar(pendingAvatarUserId, file);
            pendingAvatarUserId = null;
        });

        async function uploadAvatar(userId, file) {
            messageEl.textContent = "Envoi de la photo...";
            const ext = file.name.split(".").pop();
            const path = `avatar-${userId}-${Date.now()}.${ext}`;

            const { error: uploadError } = await sb.storage.from("avatars").upload(path, file);
            if (uploadError) {
                messageEl.textContent = "Erreur : " + uploadError.message;
                return;
            }

            const { data: publicData } = sb.storage.from("avatars").getPublicUrl(path);

            const { error: updateError } = await sb
                .from("profiles")
                .update({ avatar_override: publicData.publicUrl })
                .eq("id", userId);

            if (updateError) {
                messageEl.textContent = "Erreur : " + updateError.message;
                return;
            }

            messageEl.textContent = "";
            loadComptes();
        }

        async function resetAvatar(userId) {
            if (!confirm("Retirer la photo personnalisée ? La photo Google (si disponible) sera réaffichée.")) return;
            const { error } = await sb.from("profiles").update({ avatar_override: null }).eq("id", userId);
            if (error) {
                messageEl.textContent = "Erreur : " + error.message;
            } else {
                loadComptes();
            }
        }

        document.getElementById("searchInput").addEventListener("input", (event) => {
            const q = event.target.value.trim().toLowerCase();
            if (!q) { renderComptes(allComptes); return; }
            renderComptes(allComptes.filter(p => {
                const info = p.info;
                const nom = info && info.prenom && info.nom ? `${info.prenom} ${info.nom}`.toLowerCase() : "";
                const email = info && info.email ? info.email.toLowerCase() : "";
                return nom.includes(q) || email.includes(q);
            }));
        });
    </script>
</body>
</html>
