<!DOCTYPE html>
<html lang="fr" data-theme="nuit">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Les studios a&amp;m</title>
    <link rel="icon" type="image/png" href="../icon-192.png">
    <link rel="shortcut icon" type="image/png" href="../icon-192.png">
    <link rel="apple-touch-icon" href="../icon-192.png">
    <meta name="theme-color" content="#161513">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../brand.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        header h1 { margin: 0; font-size: 1.3rem; }
        header nav { display: flex; gap: .75rem; }
        header nav a { text-decoration: none; }

        .layout {
            display: flex;
            gap: 1.5rem;
            height: 75vh;
        }

        .conversations {
            width: 300px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            overflow-y: auto;
            flex-shrink: 0;
        }

        .conversation-item {
            padding: 1rem;
            border-bottom: 1px solid var(--line);
            cursor: pointer;
        }

        .conversation-item:hover { background: var(--surface-alt); }
        .conversation-item.active { background: var(--surface-alt); border-left: 2px solid var(--gold); }

        .conversation-item .email {
            font-weight: 600;
            font-size: .9rem;
        }

        .conversation-item .creator-badge {
            display: inline-block;
            margin-top: .3rem;
            font-family: var(--font-mono);
            font-size: .68rem;
            color: var(--ink-muted);
            letter-spacing: .04em;
            text-transform: uppercase;
        }

        .conversation-item .preview {
            font-size: .8rem;
            color: var(--ink-muted);
            margin-top: .3rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-panel {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-panel-header {
            padding: 1rem;
            background: var(--surface-alt);
            border-bottom: 1px solid var(--line);
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-panel-header .clear-link {
            background: none;
            border: none;
            color: var(--danger);
            font-size: .8rem;
            cursor: pointer;
            font-weight: 600;
            display: none;
            padding: 0;
        }

        .chat-panel-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: .6rem;
        }

        .chat-panel-form {
            display: none;
            border-top: 1px solid var(--line);
        }

        .chat-panel-form input {
            flex: 1;
            border: none;
            border-radius: 0;
            padding: .8rem;
            margin: 0;
        }

        .chat-panel-form input:focus { box-shadow: none; }

        .chat-panel-form button {
            border: none;
            border-radius: 0;
            background: var(--ink);
            color: var(--bg);
        }
    </style>
</head>
<body>
    <header>
        <h1>Messages clients</h1>
        <nav>
            <a class="btn" href="dashboard.html">← Tableau de bord</a>
            <button class="btn" id="logoutBtn">Se déconnecter</button>
        </nav>
    </header>

    <div class="layout">
        <div class="conversations" id="conversationsList">
            <p class="empty-hint">Chargement...</p>
        </div>
        <div class="chat-panel">
            <div class="chat-panel-header" id="chatPanelHeader">
                <span>Sélectionne une conversation</span>
                <button id="clearConvBtn" class="clear-link">Effacer</button>
            </div>
            <div class="chat-panel-messages" id="chatPanelMessages"></div>
            <form class="chat-panel-form" id="chatPanelForm">
                <input type="text" id="replyInput" placeholder="Répondre..." autocomplete="off">
                <button type="submit">Envoyer</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://hcvwbvqkbgtmmjkjfhza.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjdndidnFrYmd0bW1qa2pmaHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTE2OTQsImV4cCI6MjA5OTE2NzY5NH0.0xEC7Ws9edaUkTDxfC_wvvGBjCbl9Y26VP15vtFsXAQ";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const creatorNames = { mael: "Maël Domenech", abel: "Abel Burkard" };
        let currentConversation = null; // { userId, creator, email }
        let channel = null;

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str ?? "";
            return div.innerHTML;
        }

        (async () => {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) { window.location.href = "index.html"; return; }

            const { data: isAdmin } = await sb.rpc("is_admin");
            if (!isAdmin) { await sb.auth.signOut(); window.location.href = "index.html"; return; }

            loadConversations();
        })();

        document.getElementById("logoutBtn").addEventListener("click", async () => {
            await sb.auth.signOut();
            window.location.href = "index.html";
        });

        async function loadConversations() {
            const listEl = document.getElementById("conversationsList");

            // On récupère tous les messages, puis on regroupe par (user_id, creator) côté client
            const { data, error } = await sb
                .from("messages")
                .select("user_id, creator, content, sender, created_at")
                .order("created_at", { ascending: false });

            if (error) {
                listEl.innerHTML = `<p class="empty-hint">${escapeHtml(error.message)}</p>`;
                return;
            }

            if (!data || data.length === 0) {
                listEl.innerHTML = `<p class="empty-hint">Aucun message pour l'instant.</p>`;
                return;
            }

            const grouped = {};
            for (const msg of data) {
                const key = msg.user_id + "|" + msg.creator;
                if (!grouped[key]) {
                    grouped[key] = { userId: msg.user_id, creator: msg.creator, lastMessage: msg.content, lastDate: msg.created_at };
                }
            }

            const conversations = Object.values(grouped);

            // Récupère les emails des utilisateurs concernés
            const userIds = [...new Set(conversations.map(c => c.userId))];
            const { data: usersData } = await sb.rpc("get_user_emails", { user_ids: userIds });
            const emailMap = {};
            (usersData || []).forEach(u => { emailMap[u.id] = u.email; });

            listEl.innerHTML = conversations.map(conv => `
                <div class="conversation-item" data-user="${conv.userId}" data-creator="${conv.creator}">
                    <div class="email">${escapeHtml(emailMap[conv.userId] || conv.userId)}</div>
                    <span class="creator-badge">${creatorNames[conv.creator]}</span>
                    <div class="preview">${escapeHtml(conv.lastMessage)}</div>
                </div>
            `).join("");

            listEl.querySelectorAll(".conversation-item").forEach(el => {
                el.addEventListener("click", () => {
                    listEl.querySelectorAll(".conversation-item").forEach(x => x.classList.remove("active"));
                    el.classList.add("active");
                    openConversation(el.dataset.user, el.dataset.creator, emailMap[el.dataset.user] || el.dataset.user);
                });
            });
        }

        async function openConversation(userId, creator, email) {
            currentConversation = { userId, creator, email };
            document.querySelector("#chatPanelHeader span").textContent = `${email} → ${creatorNames[creator]}`;
            document.getElementById("clearConvBtn").style.display = "inline-block";
            document.getElementById("chatPanelForm").style.display = "flex";

            const messagesEl = document.getElementById("chatPanelMessages");
            messagesEl.innerHTML = "<p class='empty-hint'>Chargement...</p>";

            const { data, error } = await sb
                .from("messages")
                .select("*")
                .eq("user_id", userId)
                .eq("creator", creator)
                .order("created_at", { ascending: true });

            if (error) {
                messagesEl.innerHTML = `<p class="empty-hint">${escapeHtml(error.message)}</p>`;
                return;
            }

            messagesEl.innerHTML = "";
            data.forEach(appendMessage);
            messagesEl.scrollTop = messagesEl.scrollHeight;

            if (channel) sb.removeChannel(channel);
            channel = sb
                .channel("admin-messages-" + userId + "-" + creator)
                .on("postgres_changes", {
                    event: "INSERT",
                    schema: "public",
                    table: "messages",
                    filter: `user_id=eq.${userId}`
                }, (payload) => {
                    if (payload.new.creator === creator) {
                        appendMessage(payload.new);
                        messagesEl.scrollTop = messagesEl.scrollHeight;
                    }
                })
                .subscribe();
        }

        function appendMessage(msg) {
            const messagesEl = document.getElementById("chatPanelMessages");
            const div = document.createElement("div");
            div.className = "msg " + msg.sender;
            div.textContent = msg.content;
            messagesEl.appendChild(div);
        }

        document.getElementById("chatPanelForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            if (!currentConversation) return;

            const input = document.getElementById("replyInput");
            const content = input.value.trim();
            if (!content) return;
            input.value = "";

            await sb.from("messages").insert({
                user_id: currentConversation.userId,
                creator: currentConversation.creator,
                sender: "admin",
                content: content
            });
        });

        document.getElementById("clearConvBtn").addEventListener("click", async () => {
            if (!currentConversation) return;
            if (!confirm(`Effacer toute la conversation avec ${currentConversation.email} ? Cette action est irréversible.`)) return;

            await sb
                .from("messages")
                .delete()
                .eq("user_id", currentConversation.userId)
                .eq("creator", currentConversation.creator);

            document.getElementById("chatPanelMessages").innerHTML = "<p class='empty-hint'>Conversation effacée.</p>";
            document.getElementById("clearConvBtn").style.display = "none";
            document.getElementById("chatPanelForm").style.display = "none";
            document.querySelector("#chatPanelHeader span").textContent = "Sélectionne une conversation";
            currentConversation = null;
            loadConversations();
        });
    </script>
</body>
</html>
