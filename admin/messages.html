<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Les studios a&amp;m</title>
    <link rel="icon" type="image/jpeg" href="../unnamed.jpg">
    <link rel="apple-touch-icon" href="../icon-192.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }

        body {
            background-color: #1c1f26;
            font-family: Arial, sans-serif;
            color: #f0f0f0;
            margin: 0;
            padding: 1.5rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        h1 {
            font-size: 1.4rem;
            margin: 0;
        }

        a.nav-link, button {
            padding: 0.6rem 1rem;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-secondary {
            background-color: #3a4150;
            color: #f0f0f0;
        }

        .btn-secondary:hover {
            background-color: #4a5164;
        }

        .layout {
            display: flex;
            gap: 1.5rem;
            height: 75vh;
        }

        .conversations {
            width: 300px;
            background: #262a33;
            border-radius: 10px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .conversation-item {
            padding: 1rem;
            border-bottom: 1px solid #3a4150;
            cursor: pointer;
        }

        .conversation-item:hover {
            background: #2f3440;
        }

        .conversation-item.active {
            background: #384a68;
        }

        .conversation-item .email {
            font-weight: bold;
            font-size: 0.9rem;
        }

        .conversation-item .creator-badge {
            display: inline-block;
            margin-top: 0.3rem;
            padding: 0.15rem 0.5rem;
            border-radius: 10px;
            font-size: 0.7rem;
            background: #6EA9FB;
            color: #1c1f26;
            font-weight: bold;
        }

        .conversation-item .preview {
            font-size: 0.8rem;
            color: #999;
            margin-top: 0.3rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-panel {
            flex: 1;
            background: #262a33;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-panel-header {
            padding: 1rem;
            background: #1c1f26;
            border-bottom: 1px solid #3a4150;
            font-weight: bold;
        }

        .chat-panel-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .msg {
            max-width: 70%;
            padding: 0.6rem 0.9rem;
            border-radius: 12px;
            font-size: 0.9rem;
        }

        .msg.client {
            align-self: flex-start;
            background: #3a4150;
            color: #f0f0f0;
        }

        .msg.admin {
            align-self: flex-end;
            background: #6EA9FB;
            color: #1c1f26;
        }

        .chat-panel-form {
            display: flex;
            border-top: 1px solid #3a4150;
        }

        .chat-panel-form input {
            flex: 1;
            border: none;
            padding: 0.8rem;
            background: #1c1f26;
            color: #f0f0f0;
        }

        .chat-panel-form input:focus {
            outline: none;
        }

        .chat-panel-form button {
            border-radius: 0;
            background: #6EA9FB;
            color: #1c1f26;
        }

        .empty-hint {
            color: #999;
            text-align: center;
            padding: 2rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>💬 Messages clients</h1>
        <div style="display:flex; gap:0.75rem;">
            <a class="nav-link btn-secondary" href="dashboard.html">← Tableau de bord</a>
            <button class="btn-secondary" id="logoutBtn">Se déconnecter</button>
        </div>
    </header>

    <div class="layout">
        <div class="conversations" id="conversationsList">
            <p class="empty-hint">Chargement...</p>
        </div>
        <div class="chat-panel">
            <div class="chat-panel-header" id="chatPanelHeader" style="display:flex; justify-content:space-between; align-items:center;">
                <span>Sélectionne une conversation</span>
                <button id="clearConvBtn" style="display:none; background:none; border:none; color:#e05a5a; font-size:0.8rem; cursor:pointer; font-weight:bold;">🗑️ Effacer</button>
            </div>
            <div class="chat-panel-messages" id="chatPanelMessages"></div>
            <form class="chat-panel-form" id="chatPanelForm" style="display:none;">
                <input type="text" id="replyInput" placeholder="Répondre..." autocomplete="off">
                <button type="submit">Envoyer</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://hcvwbvqkbgtmmjkjfhza.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjdndidnFrYmd0bW1qa2pmaHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTE2OTQsImV4cCI6MjA5OTE2NzY5NH0.0xEC7Ws9edaUkTDxfC_wvvGBjCbl9Y26VP15vtFsXAQ";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const creatorNames = { mael: "Maël Domenech", abel: "Abel Burkard" };
        let currentConversation = null; // { userId, creator, email }
        let channel = null;

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str ?? "";
            return div.innerHTML;
        }

        (async () => {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) { window.location.href = "index.html"; return; }

            const { data: isAdmin } = await sb.rpc("is_admin");
            if (!isAdmin) { await sb.auth.signOut(); window.location.href = "index.html"; return; }

            loadConversations();
        })();

        document.getElementById("logoutBtn").addEventListener("click", async () => {
            await sb.auth.signOut();
            window.location.href = "index.html";
        });

        async function loadConversations() {
            const listEl = document.getElementById("conversationsList");

            // On récupère tous les messages, puis on regroupe par (user_id, creator) côté client
            const { data, error } = await sb
                .from("messages")
                .select("user_id, creator, content, sender, created_at")
                .order("created_at", { ascending: false });

            if (error) {
                listEl.innerHTML = `<p class="empty-hint">⚠️ ${error.message}</p>`;
                return;
            }

            if (!data || data.length === 0) {
                listEl.innerHTML = `<p class="empty-hint">Aucun message pour l'instant.</p>`;
                return;
            }

            const grouped = {};
            for (const msg of data) {
                const key = msg.user_id + "|" + msg.creator;
                if (!grouped[key]) {
                    grouped[key] = { userId: msg.user_id, creator: msg.creator, lastMessage: msg.content, lastDate: msg.created_at };
                }
            }

            const conversations = Object.values(grouped);

            // Récupère les emails des utilisateurs concernés
            const userIds = [...new Set(conversations.map(c => c.userId))];
            const { data: usersData } = await sb.rpc("get_user_emails", { user_ids: userIds });
            const emailMap = {};
            (usersData || []).forEach(u => { emailMap[u.id] = u.email; });

            listEl.innerHTML = conversations.map(conv => `
                <div class="conversation-item" data-user="${conv.userId}" data-creator="${conv.creator}">
                    <div class="email">${escapeHtml(emailMap[conv.userId] || conv.userId)}</div>
                    <span class="creator-badge">${creatorNames[conv.creator]}</span>
                    <div class="preview">${escapeHtml(conv.lastMessage)}</div>
                </div>
            `).join("");

            listEl.querySelectorAll(".conversation-item").forEach(el => {
                el.addEventListener("click", () => {
                    listEl.querySelectorAll(".conversation-item").forEach(x => x.classList.remove("active"));
                    el.classList.add("active");
                    openConversation(el.dataset.user, el.dataset.creator, emailMap[el.dataset.user] || el.dataset.user);
                });
            });
        }

        async function openConversation(userId, creator, email) {
            currentConversation = { userId, creator, email };
            document.querySelector("#chatPanelHeader span").textContent = `${email} → ${creatorNames[creator]}`;
            document.getElementById("clearConvBtn").style.display = "inline-block";
            document.getElementById("chatPanelForm").style.display = "flex";

            const messagesEl = document.getElementById("chatPanelMessages");
            messagesEl.innerHTML = "<p class='empty-hint'>Chargement...</p>";

            const { data, error } = await sb
                .from("messages")
                .select("*")
                .eq("user_id", userId)
                .eq("creator", creator)
                .order("created_at", { ascending: true });

            if (error) {
                messagesEl.innerHTML = `<p class="empty-hint">⚠️ ${error.message}</p>`;
                return;
            }

            messagesEl.innerHTML = "";
            data.forEach(appendMessage);
            messagesEl.scrollTop = messagesEl.scrollHeight;

            if (channel) sb.removeChannel(channel);
            channel = sb
                .channel("admin-messages-" + userId + "-" + creator)
                .on("postgres_changes", {
                    event: "INSERT",
                    schema: "public",
                    table: "messages",
                    filter: `user_id=eq.${userId}`
                }, (payload) => {
                    if (payload.new.creator === creator) {
                        appendMessage(payload.new);
                        messagesEl.scrollTop = messagesEl.scrollHeight;
                    }
                })
                .subscribe();
        }

        function appendMessage(msg) {
            const messagesEl = document.getElementById("chatPanelMessages");
            const div = document.createElement("div");
            div.className = "msg " + msg.sender;
            div.textContent = msg.content;
            messagesEl.appendChild(div);
        }

        document.getElementById("chatPanelForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            if (!currentConversation) return;

            const input = document.getElementById("replyInput");
            const content = input.value.trim();
            if (!content) return;
            input.value = "";

            await sb.from("messages").insert({
                user_id: currentConversation.userId,
                creator: currentConversation.creator,
                sender: "admin",
                content: content
            });
        });

        document.getElementById("clearConvBtn").addEventListener("click", async () => {
            if (!currentConversation) return;
            if (!confirm(`Effacer toute la conversation avec ${currentConversation.email} ? Cette action est irréversible.`)) return;

            await sb
                .from("messages")
                .delete()
                .eq("user_id", currentConversation.userId)
                .eq("creator", currentConversation.creator);

            document.getElementById("chatPanelMessages").innerHTML = "<p class='empty-hint'>Conversation effacée.</p>";
            document.getElementById("clearConvBtn").style.display = "none";
            document.getElementById("chatPanelForm").style.display = "none";
            document.querySelector("#chatPanelHeader span").textContent = "Sélectionne une conversation";
            currentConversation = null;
            loadConversations();
        });
    </script>
</body>
</html>
