<!DOCTYPE html>
<html lang="fr" data-theme="nuit">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord - Les studios a&amp;m</title>
    <link rel="icon" type="image/png" href="../icon-192.png">
    <link rel="shortcut icon" type="image/png" href="../icon-192.png">
    <link rel="apple-touch-icon" href="../icon-192.png">
    <meta name="theme-color" content="#161513">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../brand.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        header h1 { margin: 0; font-size: 1.3rem; }

        header nav { display: flex; gap: .75rem; flex-wrap: wrap; }

        header nav a { text-decoration: none; }

        .unread-count {
            display: none;
            background: var(--gold);
            color: var(--bg);
            border-radius: 10px;
            padding: .1rem .5rem;
            font-size: .75rem;
            margin-left: .4rem;
        }

        #formSection {
            display: none;
            margin-bottom: 2rem;
        }

        #formSection.active { display: block; }

        #formSection h2 { margin-top: 0; font-size: 1.1rem; }

        .form-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .form-group { flex: 1; min-width: 200px; }

        textarea { resize: vertical; min-height: 80px; }

        .form-actions {
            display: flex;
            gap: .75rem;
            margin-top: .5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        th, td {
            text-align: left;
            padding: .75rem 1rem;
            border-bottom: 1px solid var(--line);
            font-size: .92rem;
        }

        th {
            font-family: var(--font-mono);
            background: var(--surface-alt);
            color: var(--ink-muted);
            font-size: .72rem;
            letter-spacing: .05em;
            text-transform: uppercase;
        }

        .views {
            font-family: var(--font-mono);
            color: var(--gold);
        }

        .actions-cell { display: flex; gap: .5rem; }

        .btn-danger { border-color: var(--danger); color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: var(--bg); }

        #message {
            font-size: .9rem;
            margin-bottom: 1rem;
            min-height: 1.2rem;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--ink-muted);
        }

        @media (max-width: 700px) {
            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; }
            td { border-bottom: none; padding: .4rem 1rem; }
            tr { border-bottom: 1px solid var(--line); padding: .75rem 0; }
            td::before {
                content: attr(data-label);
                font-family: var(--font-mono);
                font-weight: 600;
                color: var(--ink-muted);
                display: block;
                font-size: .72rem;
                text-transform: uppercase;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Tableau de bord — Les studios a&amp;m</h1>
        <nav>
            <a class="btn" href="messages.html">Messages<span id="unreadBadge" class="unread-count"></span></a>
            <a class="btn" href="documents.html">Documents</a>
            <button class="btn-primary" id="addBtn">+ Ajouter un article</button>
            <button class="btn" id="logoutBtn">Se déconnecter</button>
        </nav>
    </header>

    <p id="message" aria-live="polite"></p>

    <section id="formSection" class="card">
        <h2 id="formTitle">Ajouter un article</h2>
        <form id="articleForm">
            <input type="hidden" id="articleId">

            <div class="form-row">
                <div class="form-group">
                    <label for="category">Catégorie</label>
                    <select id="category" required>
                        <option value="film">Film</option>
                        <option value="piece">Pièce de théâtre</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="status">Statut</label>
                    <select id="status" required>
                        <option value="publie">Publié (dans "Nos films" / "Nos pièces")</option>
                        <option value="prevision">En prévision</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="title">Titre</label>
                <input id="title" type="text" required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="image_url">Nom ou URL de l'image (optionnel)</label>
                    <input id="image_url" type="text" placeholder="ex: miserables.png">
                </div>
                <div class="form-group">
                    <label for="date_representation">Date de représentation (optionnel)</label>
                    <input id="date_representation" type="text" placeholder="ex: Samedi 26 juin 2027">
                </div>
                <div class="form-group">
                    <label for="prix">Prix (optionnel)</label>
                    <input id="prix" type="text" placeholder="ex: 5,00 €">
                </div>
            </div>

            <div class="form-group">
                <label for="trailer_file">Bande-annonce — fichier vidéo (optionnel, .mp4/.webm/.mov, 200 Mo max)</label>
                <input id="trailer_file" type="file" accept="video/mp4,video/webm,video/quicktime">
                <p id="trailerCurrent" class="small-muted" style="display:none; margin: .3rem 0 0; font-size: .85rem; color: var(--ink-muted);"></p>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary" id="saveBtn">Enregistrer</button>
                <button type="button" class="btn" id="cancelBtn">Annuler</button>
            </div>
        </form>

        <div id="relatedVideosSection" style="display:none; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--line);">
            <h3 style="margin: 0 0 .75rem; font-size: 1rem;">Vidéos liées</h3>
            <ul id="relatedVideosList" style="list-style: none; margin: 0 0 1rem; padding: 0;"></ul>
            <div class="form-row">
                <div class="form-group">
                    <label for="relatedVideoTitle">Titre de la vidéo</label>
                    <input id="relatedVideoTitle" type="text" placeholder="ex: Making-of, Scène coupée...">
                </div>
                <div class="form-group">
                    <label for="relatedVideoFile">Fichier vidéo</label>
                    <input id="relatedVideoFile" type="file" accept="video/mp4,video/webm,video/quicktime">
                </div>
            </div>
            <div class="form-actions">
                <button type="button" class="btn" id="addRelatedVideoBtn">+ Ajouter la vidéo</button>
            </div>
        </div>
    </section>

    <table>
        <thead>
            <tr>
                <th>Titre</th>
                <th>Catégorie</th>
                <th>Statut</th>
                <th>Vues</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="articlesBody">
            <tr><td colspan="5">Chargement...</td></tr>
        </tbody>
    </table>

    <script>
        const SUPABASE_URL = "https://hcvwbvqkbgtmmjkjfhza.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjdndidnFrYmd0bW1qa2pmaHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTE2OTQsImV4cCI6MjA5OTE2NzY5NH0.0xEC7Ws9edaUkTDxfC_wvvGBjCbl9Y26VP15vtFsXAQ";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const formSection = document.getElementById("formSection");
        const form = document.getElementById("articleForm");
        const messageEl = document.getElementById("message");

        let currentArticles = [];

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str ?? "";
            return div.innerHTML;
        }

        // Protection : redirige vers la connexion si pas de session, ou si pas admin
        (async () => {
            const { data: { session } } = await sb.auth.getSession();

            if (!session) {
                window.location.href = "index.html";
                return;
            }

            const { data: isAdmin, error: adminCheckError } = await sb.rpc("is_admin");

            if (adminCheckError || !isAdmin) {
                await sb.auth.signOut();
                messageEl.textContent = "Ce compte n'a pas accès au tableau de bord.";
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 2000);
                return;
            }

            loadArticles();

            const { count } = await sb
                .from("messages")
                .select("*", { count: "exact", head: true })
                .eq("sender", "client")
                .eq("read", false);

            if (count > 0) {
                const badge = document.getElementById("unreadBadge");
                badge.textContent = count;
                badge.style.display = "inline-block";
            }
        })();

        document.getElementById("logoutBtn").addEventListener("click", async () => {
            await sb.auth.signOut();
            window.location.href = "index.html";
        });

        document.getElementById("addBtn").addEventListener("click", () => {
            form.reset();
            document.getElementById("articleId").value = "";
            document.getElementById("formTitle").textContent = "Ajouter un article";
            document.getElementById("trailerCurrent").style.display = "none";
            document.getElementById("relatedVideosSection").style.display = "none";
            formSection.classList.add("active");
        });

        document.getElementById("cancelBtn").addEventListener("click", () => {
            formSection.classList.remove("active");
            form.reset();
        });

        async function uploadTrailer(file) {
            const ext = file.name.split(".").pop();
            const path = `trailer-${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;

            const { error } = await sb.storage.from("trailers").upload(path, file);
            if (error) throw error;

            const { data } = sb.storage.from("trailers").getPublicUrl(path);
            return data.publicUrl;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const id = document.getElementById("articleId").value;
            const existing = id ? currentArticles.find(a => a.id === id) : null;
            const trailerFile = document.getElementById("trailer_file").files[0];
            const saveBtn = document.getElementById("saveBtn");

            const payload = {
                category: document.getElementById("category").value,
                status: document.getElementById("status").value,
                title: document.getElementById("title").value.trim(),
                description: document.getElementById("description").value.trim() || null,
                image_url: document.getElementById("image_url").value.trim() || null,
                date_representation: document.getElementById("date_representation").value.trim() || null,
                prix: document.getElementById("prix").value.trim() || null
            };

            if (trailerFile) {
                saveBtn.disabled = true;
                saveBtn.textContent = "Envoi de la vidéo...";
                try {
                    payload.trailer_url = await uploadTrailer(trailerFile);
                } catch (uploadError) {
                    messageEl.textContent = "Erreur lors de l'envoi de la bande-annonce : " + uploadError.message;
                    saveBtn.disabled = false;
                    saveBtn.textContent = "Enregistrer";
                    return;
                }
                saveBtn.textContent = "Enregistrer";
                saveBtn.disabled = false;
            } else if (existing) {
                payload.trailer_url = existing.trailer_url || null;
            }

            let error;
            if (id) {
                ({ error } = await sb.from("articles").update(payload).eq("id", id));
            } else {
                ({ error } = await sb.from("articles").insert(payload));
            }

            if (error) {
                messageEl.textContent = "Erreur : " + error.message;
            } else {
                messageEl.textContent = "Article enregistré.";
                formSection.classList.remove("active");
                form.reset();
                loadArticles();
            }
        });

        async function loadArticles() {
            const tbody = document.getElementById("articlesBody");

            const { data, error } = await sb
                .from("articles")
                .select("*")
                .order("created_at", { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="5">Erreur de chargement : ${escapeHtml(error.message)}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="empty-state">Aucun article pour l'instant. Clique sur « + Ajouter un article ».</td></tr>`;
                return;
            }

            currentArticles = data;

            tbody.innerHTML = data.map(article => `
                <tr>
                    <td data-label="Titre">${escapeHtml(article.title)}</td>
                    <td data-label="Catégorie">${article.category === "film" ? "Film" : "Pièce"}</td>
                    <td data-label="Statut">
                        <span class="badge ${article.status === "prevision" ? "prevision" : ""}">
                            <span class="dot"></span>${article.status === "publie" ? "Publié" : "En prévision"}
                        </span>
                    </td>
                    <td data-label="Vues"><span class="views">${article.views}</span></td>
                    <td data-label="Actions" class="actions-cell">
                        <button class="btn" data-action="edit" data-id="${article.id}">Modifier</button>
                        <button class="btn btn-danger" data-action="delete" data-id="${article.id}">Supprimer</button>
                    </td>
                </tr>
            `).join("");

            tbody.querySelectorAll("[data-action='edit']").forEach(btn => {
                btn.addEventListener("click", () => editArticle(currentArticles.find(a => a.id === btn.dataset.id)));
            });
            tbody.querySelectorAll("[data-action='delete']").forEach(btn => {
                btn.addEventListener("click", () => deleteArticle(btn.dataset.id));
            });
        }

        function editArticle(article) {
            document.getElementById("articleId").value = article.id;
            document.getElementById("category").value = article.category;
            document.getElementById("status").value = article.status;
            document.getElementById("title").value = article.title;
            document.getElementById("description").value = article.description || "";
            document.getElementById("image_url").value = article.image_url || "";
            document.getElementById("date_representation").value = article.date_representation || "";
            document.getElementById("prix").value = article.prix || "";
            document.getElementById("trailer_file").value = "";
            const trailerCurrent = document.getElementById("trailerCurrent");
            if (article.trailer_url) {
                trailerCurrent.textContent = "Une bande-annonce est déjà en ligne. Choisis un fichier pour la remplacer.";
                trailerCurrent.style.display = "block";
            } else {
                trailerCurrent.style.display = "none";
            }
            document.getElementById("formTitle").textContent = "Modifier l'article";
            document.getElementById("relatedVideosSection").style.display = "block";
            loadRelatedVideos(article.id);
            formSection.classList.add("active");
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        async function loadRelatedVideos(articleId) {
            const listEl = document.getElementById("relatedVideosList");
            listEl.innerHTML = "<li class='small-muted'>Chargement...</li>";

            const { data, error } = await sb
                .from("article_videos")
                .select("*")
                .eq("article_id", articleId)
                .order("created_at", { ascending: true });

            if (error) {
                listEl.innerHTML = `<li>Erreur : ${escapeHtml(error.message)}</li>`;
                return;
            }

            if (!data || data.length === 0) {
                listEl.innerHTML = "<li class='small-muted'>Aucune vidéo liée pour l'instant.</li>";
                return;
            }

            listEl.innerHTML = data.map(video => `
                <li style="display:flex; align-items:center; justify-content:space-between; gap:.75rem; padding:.5rem 0; border-bottom:1px solid var(--line);">
                    <span>${escapeHtml(video.title)}</span>
                    <button type="button" class="btn btn-danger" data-delete-video="${video.id}">Supprimer</button>
                </li>
            `).join("");

            listEl.querySelectorAll("[data-delete-video]").forEach(btn => {
                btn.addEventListener("click", async () => {
                    if (!confirm("Supprimer cette vidéo liée ?")) return;
                    await sb.from("article_videos").delete().eq("id", btn.dataset.deleteVideo);
                    loadRelatedVideos(articleId);
                });
            });
        }

        document.getElementById("addRelatedVideoBtn").addEventListener("click", async () => {
            const articleId = document.getElementById("articleId").value;
            const titleInput = document.getElementById("relatedVideoTitle");
            const fileInput = document.getElementById("relatedVideoFile");
            const title = titleInput.value.trim();
            const file = fileInput.files[0];
            const addBtn = document.getElementById("addRelatedVideoBtn");

            if (!title || !file) {
                messageEl.textContent = "Indique un titre et choisis un fichier pour la vidéo liée.";
                return;
            }

            addBtn.disabled = true;
            addBtn.textContent = "Envoi en cours...";

            try {
                const videoUrl = await uploadTrailer(file);
                const { error } = await sb.from("article_videos").insert({
                    article_id: articleId,
                    title,
                    video_url: videoUrl
                });
                if (error) throw error;

                titleInput.value = "";
                fileInput.value = "";
                messageEl.textContent = "Vidéo liée ajoutée.";
                loadRelatedVideos(articleId);
            } catch (err) {
                messageEl.textContent = "Erreur : " + err.message;
            } finally {
                addBtn.disabled = false;
                addBtn.textContent = "+ Ajouter la vidéo";
            }
        });

        async function deleteArticle(id) {
            if (!confirm("Supprimer définitivement cet article ?")) return;

            const { error } = await sb.from("articles").delete().eq("id", id);

            if (error) {
                messageEl.textContent = "Erreur : " + error.message;
            } else {
                messageEl.textContent = "Article supprimé.";
                loadArticles();
            }
        }
    </script>
</body>
</html>
