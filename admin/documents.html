<!DOCTYPE html>
<html lang="fr" data-theme="nuit">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documents - Les studios a&amp;m</title>
    <link rel="icon" type="image/png" href="../icon-192.png">
    <link rel="shortcut icon" type="image/png" href="../icon-192.png">
    <link rel="apple-touch-icon" href="../icon-192.png">
    <meta name="theme-color" content="#161513">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../brand.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        header h1 { margin: 0; font-size: 1.3rem; }
        header nav { display: flex; gap: .75rem; flex-wrap: wrap; }
        header nav a { text-decoration: none; }

        #formSection { display: none; margin-bottom: 2rem; }
        #formSection.active { display: block; }
        #formSection h2 { margin-top: 0; font-size: 1.1rem; }

        .hint {
            font-size: .78rem;
            color: var(--ink-muted);
            margin-top: .25rem;
        }

        .form-actions {
            display: flex;
            gap: .75rem;
            margin-top: .5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        th, td {
            text-align: left;
            padding: .75rem 1rem;
            border-bottom: 1px solid var(--line);
            font-size: .92rem;
        }

        th {
            font-family: var(--font-mono);
            background: var(--surface-alt);
            color: var(--ink-muted);
            font-size: .72rem;
            letter-spacing: .05em;
            text-transform: uppercase;
        }

        .actions-cell { display: flex; gap: .5rem; }

        .btn-danger { border-color: var(--danger); color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: var(--bg); }

        #message {
            font-size: .9rem;
            margin-bottom: 1rem;
            min-height: 1.2rem;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--ink-muted);
        }
    </style>
</head>
<body>
    <header>
        <h1>Documents officiels</h1>
        <nav>
            <a class="btn" href="dashboard.html">← Tableau de bord</a>
            <button class="btn-primary" id="addBtn">+ Ajouter un document</button>
        </nav>
    </header>

    <p id="message" aria-live="polite"></p>

    <section id="formSection" class="card">
        <h2 id="formTitle">Ajouter un document</h2>
        <form id="docForm">
            <input type="hidden" id="docId">

            <div class="form-group">
                <label for="title">Titre</label>
                <input id="title" type="text" required>
            </div>

            <div class="form-group">
                <label for="description">Description (optionnel)</label>
                <textarea id="description" rows="2"></textarea>
            </div>

            <div class="form-group">
                <label for="file_name">Nom du fichier PDF</label>
                <input id="file_name" type="text" placeholder="ex: nouveau_document.pdf" required>
                <p class="hint">Le fichier PDF doit être déposé manuellement dans le dossier du site public (à côté de accueil.html), avec exactement ce nom.</p>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary" id="saveBtn">Enregistrer</button>
                <button type="button" class="btn" id="cancelBtn">Annuler</button>
            </div>
        </form>
    </section>

    <table>
        <thead>
            <tr>
                <th>Titre</th>
                <th>Fichier</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="docsBody">
            <tr><td colspan="3">Chargement...</td></tr>
        </tbody>
    </table>

    <script>
        const SUPABASE_URL = "https://hcvwbvqkbgtmmjkjfhza.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjdndidnFrYmd0bW1qa2pmaHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTE2OTQsImV4cCI6MjA5OTE2NzY5NH0.0xEC7Ws9edaUkTDxfC_wvvGBjCbl9Y26VP15vtFsXAQ";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const formSection = document.getElementById("formSection");
        const form = document.getElementById("docForm");
        const messageEl = document.getElementById("message");

        let currentDocs = [];

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str ?? "";
            return div.innerHTML;
        }

        (async () => {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) { window.location.href = "index.html"; return; }

            const { data: isAdmin } = await sb.rpc("is_admin");
            if (!isAdmin) { await sb.auth.signOut(); window.location.href = "index.html"; return; }

            loadDocuments();
        })();

        document.getElementById("addBtn").addEventListener("click", () => {
            form.reset();
            document.getElementById("docId").value = "";
            document.getElementById("formTitle").textContent = "Ajouter un document";
            formSection.classList.add("active");
        });

        document.getElementById("cancelBtn").addEventListener("click", () => {
            formSection.classList.remove("active");
            form.reset();
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const id = document.getElementById("docId").value;
            const payload = {
                title: document.getElementById("title").value.trim(),
                description: document.getElementById("description").value.trim() || null,
                file_name: document.getElementById("file_name").value.trim()
            };

            let error;
            if (id) {
                ({ error } = await sb.from("documents").update(payload).eq("id", id));
            } else {
                ({ error } = await sb.from("documents").insert(payload));
            }

            if (error) {
                messageEl.textContent = "Erreur : " + error.message;
            } else {
                messageEl.textContent = "Document enregistré.";
                formSection.classList.remove("active");
                form.reset();
                loadDocuments();
            }
        });

        async function loadDocuments() {
            const tbody = document.getElementById("docsBody");

            const { data, error } = await sb
                .from("documents")
                .select("*")
                .order("created_at", { ascending: true });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="3">${escapeHtml(error.message)}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="empty-state">Aucun document pour l'instant.</td></tr>`;
                return;
            }

            currentDocs = data;

            tbody.innerHTML = data.map(doc => `
                <tr>
                    <td>${escapeHtml(doc.title)}</td>
                    <td>${escapeHtml(doc.file_name)}</td>
                    <td class="actions-cell">
                        <button class="btn" data-action="edit" data-id="${doc.id}">Modifier</button>
                        <button class="btn btn-danger" data-action="delete" data-id="${doc.id}">Supprimer</button>
                    </td>
                </tr>
            `).join("");

            tbody.querySelectorAll("[data-action='edit']").forEach(btn => {
                btn.addEventListener("click", () => editDoc(currentDocs.find(d => d.id === btn.dataset.id)));
            });
            tbody.querySelectorAll("[data-action='delete']").forEach(btn => {
                btn.addEventListener("click", () => deleteDoc(btn.dataset.id));
            });
        }

        function editDoc(doc) {
            document.getElementById("docId").value = doc.id;
            document.getElementById("title").value = doc.title;
            document.getElementById("description").value = doc.description || "";
            document.getElementById("file_name").value = doc.file_name;
            document.getElementById("formTitle").textContent = "Modifier le document";
            formSection.classList.add("active");
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        async function deleteDoc(id) {
            if (!confirm("Supprimer cette entrée de document ? (le fichier PDF lui-même devra être retiré manuellement de ton hébergement)")) return;

            const { error } = await sb.from("documents").delete().eq("id", id);

            if (error) {
                messageEl.textContent = "Erreur : " + error.message;
            } else {
                messageEl.textContent = "Document supprimé.";
                loadDocuments();
            }
        }
    </script>
</body>
</html>
