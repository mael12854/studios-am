<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documents - Les studios a&amp;m</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }

        body {
            background-color: #1c1f26;
            font-family: Arial, sans-serif;
            color: #f0f0f0;
            margin: 0;
            padding: 1.5rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        h1 {
            font-size: 1.4rem;
            margin: 0;
        }

        button, a.nav-link {
            padding: 0.6rem 1rem;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-primary {
            background-color: #6EA9FB;
            color: #1c1f26;
        }

        .btn-primary:hover {
            background-color: #5a94e0;
        }

        .btn-secondary {
            background-color: #3a4150;
            color: #f0f0f0;
        }

        .btn-secondary:hover {
            background-color: #4a5164;
        }

        .btn-danger {
            background-color: #e05a5a;
            color: #fff;
        }

        .btn-danger:hover {
            background-color: #c94848;
        }

        .btn-small {
            padding: 0.35rem 0.7rem;
            font-size: 0.85rem;
        }

        #formSection {
            background: #262a33;
            padding: 1.5rem;
            border-radius: 10px;
            margin-bottom: 2rem;
            display: none;
        }

        #formSection.active {
            display: block;
        }

        #formSection h2 {
            margin-top: 0;
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 0.25rem;
            color: #ccc;
        }

        input, textarea {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid #444;
            border-radius: 6px;
            background: #1c1f26;
            color: #f0f0f0;
            font-family: inherit;
        }

        .hint {
            font-size: 0.75rem;
            color: #888;
            margin-top: 0.25rem;
        }

        .form-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #262a33;
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            text-align: left;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #3a4150;
            font-size: 0.9rem;
        }

        th {
            background: #1c1f26;
            color: #999;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .actions-cell {
            display: flex;
            gap: 0.5rem;
        }

        #message {
            font-size: 0.9rem;
            margin-bottom: 1rem;
            min-height: 1.2rem;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #999;
        }
    </style>
</head>
<body>
    <header>
        <h1>📄 Documents officiels</h1>
        <div style="display:flex; gap:0.75rem;">
            <a class="nav-link btn-secondary" href="dashboard.html">← Tableau de bord</a>
            <button class="btn-primary" id="addBtn">+ Ajouter un document</button>
        </div>
    </header>

    <p id="message" aria-live="polite"></p>

    <section id="formSection">
        <h2 id="formTitle">Ajouter un document</h2>
        <form id="docForm">
            <input type="hidden" id="docId">

            <div class="form-group">
                <label for="title">Titre</label>
                <input id="title" type="text" required>
            </div>

            <div class="form-group">
                <label for="description">Description (optionnel)</label>
                <textarea id="description" rows="2"></textarea>
            </div>

            <div class="form-group">
                <label for="file_name">Nom du fichier PDF</label>
                <input id="file_name" type="text" placeholder="ex: nouveau_document.pdf" required>
                <p class="hint">⚠️ Le fichier PDF doit être déposé manuellement dans le dossier du site public (à côté de accueil.html), avec exactement ce nom.</p>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary" id="saveBtn">Enregistrer</button>
                <button type="button" class="btn-secondary" id="cancelBtn">Annuler</button>
            </div>
        </form>
    </section>

    <table>
        <thead>
            <tr>
                <th>Titre</th>
                <th>Fichier</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="docsBody">
            <tr><td colspan="3">Chargement...</td></tr>
        </tbody>
    </table>

    <script>
        const SUPABASE_URL = "https://hcvwbvqkbgtmmjkjfhza.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjdndidnFrYmd0bW1qa2pmaHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTE2OTQsImV4cCI6MjA5OTE2NzY5NH0.0xEC7Ws9edaUkTDxfC_wvvGBjCbl9Y26VP15vtFsXAQ";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const formSection = document.getElementById("formSection");
        const form = document.getElementById("docForm");
        const messageEl = document.getElementById("message");

        (async () => {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) { window.location.href = "index.html"; return; }

            const { data: isAdmin } = await sb.rpc("is_admin");
            if (!isAdmin) { await sb.auth.signOut(); window.location.href = "index.html"; return; }

            loadDocuments();
        })();

        document.getElementById("addBtn").addEventListener("click", () => {
            form.reset();
            document.getElementById("docId").value = "";
            document.getElementById("formTitle").textContent = "Ajouter un document";
            formSection.classList.add("active");
        });

        document.getElementById("cancelBtn").addEventListener("click", () => {
            formSection.classList.remove("active");
            form.reset();
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const id = document.getElementById("docId").value;
            const payload = {
                title: document.getElementById("title").value.trim(),
                description: document.getElementById("description").value.trim() || null,
                file_name: document.getElementById("file_name").value.trim()
            };

            let error;
            if (id) {
                ({ error } = await sb.from("documents").update(payload).eq("id", id));
            } else {
                ({ error } = await sb.from("documents").insert(payload));
            }

            if (error) {
                messageEl.textContent = "❌ Erreur : " + error.message;
            } else {
                messageEl.textContent = "✅ Document enregistré !";
                formSection.classList.remove("active");
                form.reset();
                loadDocuments();
            }
        });

        async function loadDocuments() {
            const tbody = document.getElementById("docsBody");

            const { data, error } = await sb
                .from("documents")
                .select("*")
                .order("created_at", { ascending: true });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="3">⚠️ ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="empty-state">Aucun document pour l'instant.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(doc => `
                <tr>
                    <td>${doc.title}</td>
                    <td>${doc.file_name}</td>
                    <td class="actions-cell">
                        <button class="btn-secondary btn-small" onclick='editDoc(${JSON.stringify(doc)})'>Modifier</button>
                        <button class="btn-danger btn-small" onclick="deleteDoc('${doc.id}')">Supprimer</button>
                    </td>
                </tr>
            `).join("");
        }

        function editDoc(doc) {
            document.getElementById("docId").value = doc.id;
            document.getElementById("title").value = doc.title;
            document.getElementById("description").value = doc.description || "";
            document.getElementById("file_name").value = doc.file_name;
            document.getElementById("formTitle").textContent = "Modifier le document";
            formSection.classList.add("active");
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        async function deleteDoc(id) {
            if (!confirm("Supprimer cette entrée de document ? (le fichier PDF lui-même devra être retiré manuellement de ton hébergement)")) return;

            const { error } = await sb.from("documents").delete().eq("id", id);

            if (error) {
                messageEl.textContent = "❌ Erreur : " + error.message;
            } else {
                messageEl.textContent = "🗑️ Document supprimé.";
                loadDocuments();
            }
        }
    </script>
</body>
</html>
