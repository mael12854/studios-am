<!DOCTYPE html>
<html lang="fr" data-theme="nuit">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comptes à valider - Les studios a&amp;m</title>
    <link rel="icon" type="image/png" href="../icon-192.png">
    <link rel="shortcut icon" type="image/png" href="../icon-192.png">
    <link rel="apple-touch-icon" href="../icon-192.png">
    <meta name="theme-color" content="#161513">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../brand.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        header h1 { margin: 0; font-size: 1.3rem; }
        header nav { display: flex; gap: .75rem; flex-wrap: wrap; }
        header nav a, header nav button { text-decoration: none; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        th, td {
            text-align: left;
            padding: .75rem 1rem;
            border-bottom: 1px solid var(--line);
            font-size: .92rem;
        }

        th {
            font-family: var(--font-mono);
            background: var(--surface-alt);
            color: var(--ink-muted);
            font-size: .72rem;
            letter-spacing: .05em;
            text-transform: uppercase;
        }

        .actions-cell { display: flex; gap: .5rem; flex-wrap: wrap; }

        #message {
            font-size: .9rem;
            margin-bottom: 1rem;
            min-height: 1.2rem;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--ink-muted);
        }

        @media (max-width: 700px) {
            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; }
            td { border-bottom: none; padding: .4rem 1rem; }
            tr { border-bottom: 1px solid var(--line); padding: .75rem 0; }
            td::before {
                content: attr(data-label);
                font-family: var(--font-mono);
                font-weight: 600;
                color: var(--ink-muted);
                display: block;
                font-size: .72rem;
                text-transform: uppercase;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Comptes à valider</h1>
        <nav>
            <a class="btn" href="dashboard.html">← Tableau de bord</a>
            <button class="btn" id="logoutBtn">Se déconnecter</button>
        </nav>
    </header>

    <p id="message" aria-live="polite">Chargement...</p>

    <table>
        <thead>
            <tr>
                <th>Nom</th>
                <th>Email</th>
                <th>Inscrit le</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="comptesBody">
            <tr><td colspan="4">Chargement...</td></tr>
        </tbody>
    </table>

    <script>
        const SUPABASE_URL = "https://hcvwbvqkbgtmmjkjfhza.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjdndidnFrYmd0bW1qa2pmaHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTE2OTQsImV4cCI6MjA5OTE2NzY5NH0.0xEC7Ws9edaUkTDxfC_wvvGBjCbl9Y26VP15vtFsXAQ";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const messageEl = document.getElementById("message");

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str ?? "";
            return div.innerHTML;
        }

        function formatDateFR(iso) {
            return new Date(iso).toLocaleString("fr-FR", { dateStyle: "long", timeStyle: "short" });
        }

        document.getElementById("logoutBtn").addEventListener("click", async () => {
            await sb.auth.signOut();
            window.location.href = "index.html";
        });

        (async () => {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) { window.location.href = "index.html"; return; }

            const { data: isAdmin } = await sb.rpc("is_admin");
            if (!isAdmin) { await sb.auth.signOut(); window.location.href = "index.html"; return; }

            loadComptes();

            sb.channel("comptes-en-attente")
                .on("postgres_changes", { event: "*", schema: "public", table: "profiles" }, () => loadComptes())
                .subscribe();
        })();

        async function loadComptes() {
            const tbody = document.getElementById("comptesBody");

            const { data: pending, error } = await sb
                .from("profiles")
                .select("id, created_at")
                .eq("valide", false)
                .eq("refuse", false)
                .order("created_at", { ascending: true });

            if (error) {
                messageEl.textContent = "Erreur : " + error.message;
                return;
            }

            if (!pending || pending.length === 0) {
                messageEl.textContent = "";
                tbody.innerHTML = `<tr><td colspan="4" class="empty-state">Aucun compte en attente de validation.</td></tr>`;
                return;
            }

            const { data: profiles } = await sb.rpc("get_user_profiles", { user_ids: pending.map(p => p.id) });
            const profileMap = {};
            (profiles || []).forEach(p => { profileMap[p.id] = p; });

            messageEl.textContent = "";
            tbody.innerHTML = pending.map(p => {
                const info = profileMap[p.id];
                const nom = info && info.prenom && info.nom ? `${info.prenom} ${info.nom}` : "—";
                const email = info ? info.email : p.id;
                return `
                    <tr data-id="${p.id}">
                        <td data-label="Nom">${escapeHtml(nom)}</td>
                        <td data-label="Email">${escapeHtml(email)}</td>
                        <td data-label="Inscrit le">${escapeHtml(formatDateFR(p.created_at))}</td>
                        <td data-label="Actions" class="actions-cell">
                            <button class="btn-primary" data-action="valider" data-id="${p.id}">Valider</button>
                            <button class="btn btn-danger" data-action="refuser" data-id="${p.id}">Refuser</button>
                        </td>
                    </tr>
                `;
            }).join("");

            tbody.querySelectorAll("[data-action='valider']").forEach(btn => {
                btn.addEventListener("click", () => setValidation(btn.dataset.id, { valide: true, refuse: false }));
            });
            tbody.querySelectorAll("[data-action='refuser']").forEach(btn => {
                btn.addEventListener("click", () => {
                    if (!confirm("Refuser ce compte ? Il restera bloqué sur l'écran d'attente.")) return;
                    setValidation(btn.dataset.id, { valide: false, refuse: true });
                });
            });
        }

        async function setValidation(id, patch) {
            const { error } = await sb.from("profiles").update(patch).eq("id", id);
            if (error) {
                messageEl.textContent = "Erreur : " + error.message;
            } else {
                loadComptes();
            }
        }
    </script>
</body>
</html>
