<!DOCTYPE html>
<html lang="fr" data-theme="nuit">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film privé - Les studios a&amp;m</title>
    <link rel="icon" type="image/png" href="../icon-192.png">
    <link rel="shortcut icon" type="image/png" href="../icon-192.png">
    <link rel="apple-touch-icon" href="../icon-192.png">
    <meta name="theme-color" content="#161513">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../brand.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        header h1 { margin: 0; font-size: 1.3rem; }
        header nav { display: flex; gap: .75rem; flex-wrap: wrap; }
        header nav a, header nav button { text-decoration: none; }

        .form-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .form-group { flex: 1; min-width: 200px; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        th, td {
            text-align: left;
            padding: .75rem 1rem;
            border-bottom: 1px solid var(--line);
            font-size: .92rem;
        }

        th {
            font-family: var(--font-mono);
            background: var(--surface-alt);
            color: var(--ink-muted);
            font-size: .72rem;
            letter-spacing: .05em;
            text-transform: uppercase;
        }

        .badge.publie { background: var(--sage); }

        .actions-cell { display: flex; gap: .5rem; flex-wrap: wrap; }

        #message {
            font-size: .9rem;
            margin-bottom: 1rem;
            min-height: 1.2rem;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--ink-muted);
        }

        @media (max-width: 700px) {
            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; }
            td { border-bottom: none; padding: .4rem 1rem; }
            tr { border-bottom: 1px solid var(--line); padding: .75rem 0; }
            td::before {
                content: attr(data-label);
                font-family: var(--font-mono);
                font-weight: 600;
                color: var(--ink-muted);
                display: block;
                font-size: .72rem;
                text-transform: uppercase;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Film privé</h1>
        <nav>
            <a class="btn" href="dashboard.html">← Tableau de bord</a>
            <button class="btn" id="logoutBtn">Se déconnecter</button>
        </nav>
    </header>

    <p id="message" aria-live="polite"></p>

    <section class="card" style="margin-bottom: 1.5rem;">
        <h2 style="margin-top:0; font-size:1.05rem;">Ajouter un film</h2>
        <p class="small-muted" style="margin:0 0 1rem;">Mets la vidéo en « non répertorié » sur YouTube, puis colle son lien ici. Elle sera intégrée en iframe — jamais hébergée sur le site.</p>
        <form id="filmForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="titre">Titre</label>
                    <input id="titre" type="text" required>
                </div>
                <div class="form-group">
                    <label for="urlVideo">Lien YouTube (non répertorié)</label>
                    <input id="urlVideo" type="url" placeholder="https://www.youtube.com/watch?v=..." required>
                </div>
            </div>
            <div class="form-actions" style="margin-top:.75rem;">
                <button type="submit" class="btn-primary">Ajouter</button>
            </div>
        </form>
    </section>

    <table>
        <thead>
            <tr>
                <th>Titre</th>
                <th>Statut</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="filmsBody">
            <tr><td colspan="3">Chargement...</td></tr>
        </tbody>
    </table>

    <script>
        const SUPABASE_URL = "https://hcvwbvqkbgtmmjkjfhza.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjdndidnFrYmd0bW1qa2pmaHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTE2OTQsImV4cCI6MjA5OTE2NzY5NH0.0xEC7Ws9edaUkTDxfC_wvvGBjCbl9Y26VP15vtFsXAQ";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const messageEl = document.getElementById("message");

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str ?? "";
            return div.innerHTML;
        }

        document.getElementById("logoutBtn").addEventListener("click", async () => {
            await sb.auth.signOut();
            window.location.href = "index.html";
        });

        (async () => {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) { window.location.href = "index.html"; return; }

            const { data: isAdmin } = await sb.rpc("is_admin");
            if (!isAdmin) { await sb.auth.signOut(); window.location.href = "index.html"; return; }

            loadFilms();
        })();

        document.getElementById("filmForm").addEventListener("submit", async (event) => {
            event.preventDefault();

            const titre = document.getElementById("titre").value.trim();
            const urlVideo = document.getElementById("urlVideo").value.trim();

            if (!titre || !urlVideo) return;

            const { error } = await sb.from("films_prives").insert({ titre, url_video: urlVideo, publie: false });

            if (error) {
                messageEl.textContent = "Erreur : " + error.message;
            } else {
                messageEl.textContent = "Film ajouté (non publié). Clique sur « Publier » pour le rendre visible.";
                document.getElementById("filmForm").reset();
                loadFilms();
            }
        });

        async function loadFilms() {
            const tbody = document.getElementById("filmsBody");

            const { data, error } = await sb
                .from("films_prives")
                .select("*")
                .order("created_at", { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="3">${escapeHtml(error.message)}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="empty-state">Aucun film ajouté pour l'instant.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(f => `
                <tr data-id="${f.id}">
                    <td data-label="Titre">${escapeHtml(f.titre)}</td>
                    <td data-label="Statut">
                        <span class="badge ${f.publie ? "publie" : ""}"><span class="dot"></span>${f.publie ? "Publié" : "Non publié"}</span>
                    </td>
                    <td data-label="Actions" class="actions-cell">
                        <button class="btn" data-action="toggle" data-id="${f.id}" data-current="${f.publie ? "1" : "0"}">${f.publie ? "Dépublier" : "Publier"}</button>
                        <button class="btn btn-danger" data-action="delete" data-id="${f.id}">Supprimer</button>
                    </td>
                </tr>
            `).join("");

            tbody.querySelectorAll("[data-action='toggle']").forEach(btn => {
                btn.addEventListener("click", () => togglePublie(btn.dataset.id, btn.dataset.current === "1"));
            });
            tbody.querySelectorAll("[data-action='delete']").forEach(btn => {
                btn.addEventListener("click", () => deleteFilm(btn.dataset.id));
            });
        }

        async function togglePublie(id, current) {
            const { error } = await sb.from("films_prives").update({ publie: !current }).eq("id", id);
            if (error) {
                messageEl.textContent = "Erreur : " + error.message;
            } else {
                loadFilms();
            }
        }

        async function deleteFilm(id) {
            if (!confirm("Supprimer définitivement ce film ?")) return;
            const { error } = await sb.from("films_prives").delete().eq("id", id);
            if (error) {
                messageEl.textContent = "Erreur : " + error.message;
            } else {
                messageEl.textContent = "Film supprimé.";
                loadFilms();
            }
        }
    </script>
</body>
</html>
