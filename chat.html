<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discuter avec les créateurs - Les studios a&amp;m</title>
    <link rel="icon" type="image/png" href="icon-192-lumiere.png">
    <link rel="shortcut icon" type="image/png" href="icon-192-lumiere.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F6F1E5">
    <link rel="apple-touch-icon" href="icon-192-lumiere.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="brand.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { text-align: center; }

        .creator-tabs {
            display: flex;
            gap: .75rem;
            margin-bottom: 1.5rem;
        }

        .creator-tab {
            padding: .6rem 1.2rem;
        }

        .creator-tab.active {
            background: var(--ink);
            color: var(--bg);
            border-color: var(--ink);
        }

        .chat-box {
            background: var(--surface);
            border: 1px solid var(--line);
            width: 100%;
            max-width: 480px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            height: 60vh;
            overflow: hidden;
        }

        .chat-header {
            padding: 1rem;
            background: var(--surface-alt);
            border-bottom: 1px solid var(--line);
            font-weight: 600;
            text-align: center;
        }

        .chat-header .clear-link {
            float: right;
            background: none;
            border: none;
            color: var(--danger);
            font-size: .8rem;
            cursor: pointer;
            font-weight: 600;
            padding: 0;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: .6rem;
        }

        .chat-form {
            display: flex;
            border-top: 1px solid var(--line);
        }

        .chat-form input {
            flex: 1;
            border: none;
            border-radius: 0;
            padding: .8rem;
            margin: 0;
        }

        .chat-form input:focus { box-shadow: none; }

        .chat-form button {
            border: none;
            border-radius: 0;
            background: var(--ink);
            color: var(--bg);
            padding: 0 1.2rem;
        }

        .chat-form button:hover { background: var(--metal-strong); }

        body.high-contrast .msg.admin {
            background-color: #333 !important;
            color: #fff !important;
        }
    </style>
</head>
<body>
    <h1>Discuter avec les créateurs</h1>

    <div class="creator-tabs">
        <button class="creator-tab btn active" id="tabMael" onclick="selectCreator('mael')">Maël Domenech</button>
        <button class="creator-tab btn" id="tabAbel" onclick="selectCreator('abel')">Abel Burkard</button>
    </div>

    <div class="chat-box">
        <div class="chat-header">
            <span id="chatHeader">Conversation avec Maël Domenech</span>
            <button class="clear-link" id="clearBtn">Effacer</button>
        </div>
        <div class="chat-messages" id="chatMessages">
            <p class="empty-hint">Chargement...</p>
        </div>
        <form class="chat-form" id="chatForm">
            <input type="text" id="messageInput" placeholder="Écris ton message..." required autocomplete="off">
            <button type="submit">Envoyer</button>
        </form>
    </div>

    <a class="btn back" href="accueil.html">Retour à l'accueil</a>

    <div id="a11y-widget">
        <button id="a11yToggle" aria-label="Options d'accessibilité" title="Options d'accessibilité">♿</button>
        <div id="a11yPanel" aria-hidden="true">
            <button id="fontIncrease" aria-label="Agrandir le texte">A+</button>
            <button id="fontDecrease" aria-label="Réduire le texte">A-</button>
            <button id="contrastToggle" aria-label="Activer le contraste élevé">Contraste élevé</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://hcvwbvqkbgtmmjkjfhza.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjdndidnFrYmd0bW1qa2pmaHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTE2OTQsImV4cCI6MjA5OTE2NzY5NH0.0xEC7Ws9edaUkTDxfC_wvvGBjCbl9Y26VP15vtFsXAQ";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const creatorNames = { mael: "Maël Domenech", abel: "Abel Burkard" };
        let currentCreator = "mael";
        let currentUserId = null;
        let channel = null;

        (async () => {
            const { data: { session } } = await sb.auth.getSession();

            if (!session) {
                window.location.href = "index.html";
                return;
            }

            currentUserId = session.user.id;
            loadConversation();
        })();

        function selectCreator(creator) {
            currentCreator = creator;
            document.getElementById("tabMael").classList.toggle("active", creator === "mael");
            document.getElementById("tabAbel").classList.toggle("active", creator === "abel");
            document.getElementById("chatHeader").textContent = "Conversation avec " + creatorNames[creator];
            loadConversation();
        }

        async function loadConversation() {
            const messagesEl = document.getElementById("chatMessages");
            messagesEl.innerHTML = "<p class='empty-hint'>Chargement...</p>";

            const { data, error } = await sb
                .from("messages")
                .select("*")
                .eq("user_id", currentUserId)
                .eq("creator", currentCreator)
                .order("created_at", { ascending: true });

            if (error) {
                messagesEl.innerHTML = "<p class='empty-hint'>Impossible de charger la conversation.</p>";
                return;
            }

            renderMessages(data);

            // Marquer les messages des créateurs comme lus
            await sb
                .from("messages")
                .update({ read: true })
                .eq("user_id", currentUserId)
                .eq("creator", currentCreator)
                .eq("sender", "admin")
                .eq("read", false);

            if (channel) {
                sb.removeChannel(channel);
            }

            channel = sb
                .channel("messages-" + currentUserId + "-" + currentCreator)
                .on("postgres_changes", {
                    event: "INSERT",
                    schema: "public",
                    table: "messages",
                    filter: `user_id=eq.${currentUserId}`
                }, (payload) => {
                    if (payload.new.creator === currentCreator) {
                        appendMessage(payload.new);
                        if (payload.new.sender === "admin") {
                            sb.from("messages").update({ read: true }).eq("id", payload.new.id).then(() => {});
                        }
                    }
                })
                .subscribe();
        }

        function renderMessages(messages) {
            const messagesEl = document.getElementById("chatMessages");

            if (!messages || messages.length === 0) {
                const p = document.createElement("p");
                p.className = "empty-hint";
                p.textContent = "Dis bonjour à " + creatorNames[currentCreator];
                messagesEl.innerHTML = "";
                messagesEl.appendChild(p);
                return;
            }

            messagesEl.innerHTML = "";
            messages.forEach(appendMessage);
        }

        function appendMessage(msg) {
            const messagesEl = document.getElementById("chatMessages");
            const hint = messagesEl.querySelector(".empty-hint");
            if (hint) hint.remove();

            const div = document.createElement("div");
            div.className = "msg " + msg.sender;
            div.textContent = msg.content;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        document.getElementById("chatForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            const input = document.getElementById("messageInput");
            const content = input.value.trim();
            if (!content) return;

            input.value = "";

            await sb.from("messages").insert({
                user_id: currentUserId,
                creator: currentCreator,
                sender: "client",
                content: content
            });
        });

        document.getElementById("clearBtn").addEventListener("click", async () => {
            if (!confirm("Effacer toute la conversation avec " + creatorNames[currentCreator] + " ? Cette action est irréversible.")) return;

            await sb
                .from("messages")
                .delete()
                .eq("user_id", currentUserId)
                .eq("creator", currentCreator);

            loadConversation();
        });

        (function () {
            const toggle = document.getElementById('a11yToggle');
            const panel = document.getElementById('a11yPanel');
            const fontIncrease = document.getElementById('fontIncrease');
            const fontDecrease = document.getElementById('fontDecrease');
            const contrastToggle = document.getElementById('contrastToggle');

            let fontSize = parseInt(localStorage.getItem('a11y-fontSize')) || 100;
            let highContrast = localStorage.getItem('a11y-contrast') === 'true';

            function applySettings() {
                document.documentElement.style.fontSize = fontSize + '%';
                document.body.classList.toggle('high-contrast', highContrast);
            }
            applySettings();

            toggle.addEventListener('click', () => {
                const isActive = panel.classList.toggle('active');
                panel.setAttribute('aria-hidden', String(!isActive));
            });

            fontIncrease.addEventListener('click', () => {
                fontSize = Math.min(fontSize + 10, 150);
                localStorage.setItem('a11y-fontSize', fontSize);
                applySettings();
            });

            fontDecrease.addEventListener('click', () => {
                fontSize = Math.max(fontSize - 10, 80);
                localStorage.setItem('a11y-fontSize', fontSize);
                applySettings();
            });

            contrastToggle.addEventListener('click', () => {
                highContrast = !highContrast;
                localStorage.setItem('a11y-contrast', highContrast);
                applySettings();
            });
        })();
    </script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js").catch(() => {});
        }
    </script>
</body>
</html>
