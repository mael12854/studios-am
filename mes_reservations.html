<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Mes réservations - Les studios a&amp;m</title>
    <link rel="icon" type="image/png" href="icon-192-lumiere.png">
    <link rel="shortcut icon" type="image/png" href="icon-192-lumiere.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F6F1E5">
    <link rel="apple-touch-icon" href="icon-192-lumiere.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="brand.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        body { text-align: center; }

        .page-logo { margin: 0 auto 1rem; }

        .due-total {
            max-width: 420px;
            margin: 0 auto 1.5rem;
            text-align: center;
        }

        .due-total .amount {
            font-family: var(--font-display);
            font-size: 1.8rem;
            color: var(--gold);
            margin: .25rem 0;
        }

        .due-total p {
            margin: 0;
            color: var(--ink-muted);
            font-size: .9rem;
        }

        .res-list {
            max-width: 550px;
            margin: 0 auto;
            text-align: left;
        }

        .res-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .res-info h3 {
            margin: 0 0 .3rem;
            font-size: 1.05rem;
        }

        .res-info p {
            margin: 0;
            font-size: .85rem;
            color: var(--ink-muted);
        }

        .res-card .badge.paid { background: var(--sage); }

        .res-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: .5rem;
        }
    </style>
</head>
<body>
    <img class="page-logo" src="icon-512-lumiere.png" alt="Logo des studios a&amp;m">

    <h2>Mes réservations</h2>

    <div class="due-total card" id="dueTotal">
        <p>Chargement...</p>
    </div>

    <div class="res-list" id="resList"></div>

    <a class="btn back" href="accueil.html">Retour à l'accueil</a>

    <div id="a11y-widget">
        <button id="a11yToggle" aria-label="Options d'accessibilité" title="Options d'accessibilité">♿</button>
        <div id="a11yPanel" aria-hidden="true">
            <button id="fontIncrease" aria-label="Agrandir le texte">A+</button>
            <button id="fontDecrease" aria-label="Réduire le texte">A-</button>
            <button id="contrastToggle" aria-label="Activer le contraste élevé">Contraste élevé</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://hcvwbvqkbgtmmjkjfhza.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjdndidnFrYmd0bW1qa2pmaHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTE2OTQsImV4cCI6MjA5OTE2NzY5NH0.0xEC7Ws9edaUkTDxfC_wvvGBjCbl9Y26VP15vtFsXAQ";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str ?? "";
            return div.innerHTML;
        }

        function formatDateFR(isoDate) {
            if (!isoDate) return null;
            const d = new Date(isoDate + "T00:00:00");
            return d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
        }

        function formatPrice(num) {
            return Number(num).toFixed(2).replace(".", ",") + " €";
        }

        function lineAmount(r) {
            return (r.quantity - (r.minors || 0)) * r.unit_price;
        }

        const SITE_URL = "https://studios-am.vercel.app";

        async function generateTicketPdf(r, clientName) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ unit: "mm", format: "a5" });

            const gold = [189, 155, 71];
            const ink = [26, 24, 22];
            const muted = [120, 110, 100];

            doc.setFont("times", "bold");
            doc.setFontSize(18);
            doc.setTextColor(...ink);
            doc.text("Les studios A&M", 10, 15);

            doc.setFont("times", "normal");
            doc.setFontSize(11);
            doc.setTextColor(...gold);
            doc.text("Billet de réservation", 10, 22);

            doc.setDrawColor(...gold);
            doc.line(10, 26, 138, 26);

            doc.setTextColor(...ink);
            doc.setFont("times", "bold");
            doc.setFontSize(13);
            doc.text(r.articles ? r.articles.title : "Événement", 10, 36);

            doc.setFont("times", "normal");
            doc.setFontSize(10);
            let y = 44;
            const eventDate = r.articles && r.articles.date_representation ? formatDateFR(r.articles.date_representation) : "à confirmer";
            doc.text(`Date : ${eventDate}`, 10, y);
            y += 6;
            const lieu = r.articles && r.articles.lieu ? r.articles.lieu : "à confirmer, voir le site";
            doc.text(`Lieu : ${lieu}`, 10, y, { maxWidth: 80 });
            y += 6;
            doc.text(`Titulaire : ${clientName}`, 10, y);
            y += 6;
            doc.text(`Places : ${r.quantity} (dont ${r.minors || 0} mineur(s), gratuit)`, 10, y);
            y += 6;
            doc.text(`A régler en liquide sur place : ${formatPrice(lineAmount(r))}`, 10, y);
            y += 6;
            doc.text(`Statut : ${r.paid ? "payé" : "à régler avant la séance"}`, 10, y);

            doc.setTextColor(...muted);
            doc.setFontSize(8);
            doc.text("Ce billet n'est valable qu'une fois : il sera contrôlé et validé par Abel ou Maël à l'entrée.", 10, 78, { maxWidth: 118 });

            const validationUrl = `${SITE_URL}/admin/validation.html?id=${r.id}`;
            try {
                const qrDataUrl = await QRCode.toDataURL(validationUrl, { margin: 1, width: 220 });
                doc.addImage(qrDataUrl, "PNG", 93, 36, 36, 36);
            } catch (e) {}

            const safeTitle = (r.articles ? r.articles.title : "reservation").toLowerCase().replace(/[^a-z0-9]+/gi, "-");
            doc.save(`billet-${safeTitle}.pdf`);
        }

        (async () => {
            const { data: { session } } = await sb.auth.getSession();

            if (!session) {
                window.location.href = "index.html";
                return;
            }

            const meta = session.user.user_metadata || {};
            const clientName = (meta.prenom && meta.nom) ? `${meta.prenom} ${meta.nom}` : session.user.email;

            const dueTotalEl = document.getElementById("dueTotal");
            const resListEl = document.getElementById("resList");

            const { data, error } = await sb
                .from("ticket_reservations")
                .select("*, articles(title, date_representation, lieu)")
                .eq("user_id", session.user.id)
                .order("created_at", { ascending: false });

            if (error) {
                dueTotalEl.innerHTML = `<p>Impossible de charger vos réservations.</p>`;
                return;
            }

            if (!data || data.length === 0) {
                dueTotalEl.innerHTML = `<p>Vous n'avez aucune réservation pour l'instant.</p>`;
                resListEl.innerHTML = "";
                return;
            }

            const totalDue = data
                .filter(r => !r.paid)
                .reduce((sum, r) => sum + lineAmount(r), 0);

            if (totalDue > 0) {
                dueTotalEl.innerHTML = `
                    <p>Vous devez, en liquide, à régler auprès d'Abel ou Maël avant la séance :</p>
                    <p class="amount">${formatPrice(totalDue)}</p>
                `;
            } else {
                dueTotalEl.innerHTML = `<p>Vous n'avez rien à payer actuellement.</p>`;
            }

            resListEl.innerHTML = data.map(r => `
                <div class="res-card card">
                    <div class="res-info">
                        <h3>${escapeHtml(r.articles ? r.articles.title : "Événement")}</h3>
                        ${r.articles && r.articles.date_representation ? `<p>${escapeHtml(formatDateFR(r.articles.date_representation))}</p>` : ""}
                        ${r.articles && r.articles.lieu ? `<p>${escapeHtml(r.articles.lieu)}</p>` : ""}
                        <p>${r.quantity} place(s), dont ${r.minors || 0} mineur(s) &middot; ${escapeHtml(formatPrice(lineAmount(r)))}</p>
                    </div>
                    <div class="res-actions">
                        <span class="badge ${r.paid ? "paid" : "prevision"}"><span class="dot"></span>${r.paid ? "Payé" : "À régler"}</span>
                        <button type="button" class="btn" data-pdf-btn="${r.id}">Billet PDF</button>
                    </div>
                </div>
            `).join("");

            resListEl.querySelectorAll("[data-pdf-btn]").forEach(btn => {
                btn.addEventListener("click", () => {
                    const r = data.find(item => item.id === btn.dataset.pdfBtn);
                    if (r) generateTicketPdf(r, clientName);
                });
            });
        })();

        (function () {
            const toggle = document.getElementById('a11yToggle');
            const panel = document.getElementById('a11yPanel');
            const fontIncrease = document.getElementById('fontIncrease');
            const fontDecrease = document.getElementById('fontDecrease');
            const contrastToggle = document.getElementById('contrastToggle');

            let fontSize = parseInt(localStorage.getItem('a11y-fontSize')) || 100;
            let highContrast = localStorage.getItem('a11y-contrast') === 'true';

            function applySettings() {
                document.documentElement.style.fontSize = fontSize + '%';
                document.body.classList.toggle('high-contrast', highContrast);
            }
            applySettings();

            toggle.addEventListener('click', () => {
                const isActive = panel.classList.toggle('active');
                panel.setAttribute('aria-hidden', String(!isActive));
            });

            fontIncrease.addEventListener('click', () => {
                fontSize = Math.min(fontSize + 10, 150);
                localStorage.setItem('a11y-fontSize', fontSize);
                applySettings();
            });

            fontDecrease.addEventListener('click', () => {
                fontSize = Math.max(fontSize - 10, 80);
                localStorage.setItem('a11y-fontSize', fontSize);
                applySettings();
            });

            contrastToggle.addEventListener('click', () => {
                highContrast = !highContrast;
                localStorage.setItem('a11y-contrast', highContrast);
                applySettings();
            });
        })();
    </script>

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js").catch(() => {});
        }
    </script>

    <!-- Tawk.to -->

        try {

                const { data: { session } } = await sb.auth.getSession();

                    const meta = session.user.user_metadata || {};
                    Tawk_API.visitor = {
                        name: (meta.prenom && meta.nom) ? `${meta.prenom} ${meta.nom}` : session.user.email,
                        email: session.user.email
                    };
                }
            }
        } catch (e) {}
    })();

    var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
    s1.async=true;

    })();
    </script>
</body>
</html>
