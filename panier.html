<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Panier - Les studios a&amp;m</title>
    <link rel="icon" type="image/png" href="icon-192-lumiere.png">
    <link rel="shortcut icon" type="image/png" href="icon-192-lumiere.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F6F1E5">
    <link rel="apple-touch-icon" href="icon-192-lumiere.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="brand.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { text-align: center; }

        .page-logo { margin: 0 auto 1rem; }

        .cart-list {
            max-width: 550px;
            margin: 0 auto;
            text-align: left;
        }

        .cart-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .cart-info h3 {
            margin: 0 0 .3rem;
            font-size: 1.05rem;
        }

        .cart-info p {
            margin: 0;
            font-size: .85rem;
            color: var(--ink-muted);
        }

        .cart-fields {
            display: flex;
            align-items: center;
            gap: .5rem;
        }

        .cart-fields label {
            margin: 0;
            font-size: .78rem;
        }

        .cart-fields input[type="number"] {
            width: 4rem;
            margin-bottom: 0;
            text-align: center;
        }

        .cart-total {
            max-width: 550px;
            margin: 1.5rem auto;
            text-align: center;
        }

        .cart-total .amount {
            font-family: var(--font-display);
            font-size: 1.8rem;
            color: var(--gold);
            margin: .25rem 0;
        }

        #message {
            font-size: .9rem;
            min-height: 1.2rem;
            text-align: center;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <img class="page-logo" src="icon-512-lumiere.png" alt="Logo des studios a&amp;m">

    <h2>Panier</h2>

    <p id="message" aria-live="polite"></p>

    <div class="cart-list" id="cartList"></div>

    <div class="cart-total card" id="cartTotal" style="display:none;">
        <p>Montant à prévoir en liquide, à régler sur place avant la séance :</p>
        <p class="amount" id="cartTotalAmount"></p>
        <button type="button" class="btn-primary" id="validateBtn">Valider la réservation</button>
    </div>

    <a class="btn back" href="accueil.html">Retour à l'accueil</a>

    <div id="a11y-widget">
        <button id="a11yToggle" aria-label="Options d'accessibilité" title="Options d'accessibilité">♿</button>
        <div id="a11yPanel" aria-hidden="true">
            <button id="fontIncrease" aria-label="Agrandir le texte">A+</button>
            <button id="fontDecrease" aria-label="Réduire le texte">A-</button>
            <button id="contrastToggle" aria-label="Activer le contraste élevé">Contraste élevé</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://hcvwbvqkbgtmmjkjfhza.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjdndidnFrYmd0bW1qa2pmaHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTE2OTQsImV4cCI6MjA5OTE2NzY5NH0.0xEC7Ws9edaUkTDxfC_wvvGBjCbl9Y26VP15vtFsXAQ";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const CART_KEY = "am-cart";

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str ?? "";
            return div.innerHTML;
        }

        function formatPrice(num) {
            return Number(num).toFixed(2).replace(".", ",") + " €";
        }

        function getCart() {
            try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; } catch (e) { return []; }
        }

        function saveCart(cart) {
            localStorage.setItem(CART_KEY, JSON.stringify(cart));
        }

        function lineTotal(item) {
            return (item.quantity - item.minors) * item.unit_price;
        }

        function render() {
            const cart = getCart();
            const listEl = document.getElementById("cartList");
            const totalEl = document.getElementById("cartTotal");

            if (cart.length === 0) {
                listEl.innerHTML = "<p style='text-align:center;'>Votre panier est vide.</p>";
                totalEl.style.display = "none";
                return;
            }

            listEl.innerHTML = cart.map((item, index) => `
                <div class="cart-card card">
                    <div class="cart-info">
                        <h3>${escapeHtml(item.title)}</h3>
                        <p>${escapeHtml(formatPrice(item.unit_price))} la place &middot; ${escapeHtml(formatPrice(lineTotal(item)))}</p>
                    </div>
                    <div class="cart-fields">
                        <label>Places <input type="number" min="1" value="${item.quantity}" data-cart-qty="${index}"></label>
                        <label>Mineurs <input type="number" min="0" value="${item.minors}" data-cart-minors="${index}"></label>
                        <button type="button" class="btn btn-danger" data-cart-remove="${index}">Retirer</button>
                    </div>
                </div>
            `).join("");

            const total = cart.reduce((sum, item) => sum + lineTotal(item), 0);
            document.getElementById("cartTotalAmount").textContent = formatPrice(total);
            totalEl.style.display = "block";

            listEl.querySelectorAll("[data-cart-qty]").forEach(input => {
                input.addEventListener("change", () => {
                    const i = parseInt(input.dataset.cartQty);
                    const cart = getCart();
                    cart[i].quantity = Math.max(1, parseInt(input.value) || 1);
                    if (cart[i].minors > cart[i].quantity) cart[i].minors = cart[i].quantity;
                    saveCart(cart);
                    render();
                });
            });

            listEl.querySelectorAll("[data-cart-minors]").forEach(input => {
                input.addEventListener("change", () => {
                    const i = parseInt(input.dataset.cartMinors);
                    const cart = getCart();
                    let minors = Math.max(0, parseInt(input.value) || 0);
                    if (minors > cart[i].quantity) minors = cart[i].quantity;
                    cart[i].minors = minors;
                    saveCart(cart);
                    render();
                });
            });

            listEl.querySelectorAll("[data-cart-remove]").forEach(btn => {
                btn.addEventListener("click", () => {
                    const i = parseInt(btn.dataset.cartRemove);
                    const cart = getCart();
                    cart.splice(i, 1);
                    saveCart(cart);
                    render();
                });
            });
        }

        document.getElementById("validateBtn").addEventListener("click", async () => {
            const messageEl = document.getElementById("message");
            const validateBtn = document.getElementById("validateBtn");

            const { data: { session } } = await sb.auth.getSession();
            if (!session) {
                messageEl.textContent = "Connectez-vous pour valider votre réservation.";
                return;
            }

            const cart = getCart();
            if (cart.length === 0) return;

            validateBtn.disabled = true;
            validateBtn.textContent = "Validation...";

            const rows = cart.map(item => ({
                article_id: item.article_id,
                user_id: session.user.id,
                quantity: item.quantity,
                minors: item.minors,
                unit_price: item.unit_price
            }));

            const { error } = await sb.from("ticket_reservations").insert(rows);

            if (error) {
                messageEl.textContent = "Erreur : " + error.message;
                validateBtn.disabled = false;
                validateBtn.textContent = "Valider la réservation";
            } else {
                saveCart([]);
                document.getElementById("cartList").innerHTML = "";
                document.getElementById("cartTotal").style.display = "none";
                messageEl.innerHTML = "Réservation confirmée. Retrouvez vos billets sur <a href=\"mes_reservations.html\">Mes réservations</a>.";
            }
        });

        render();

        (function () {
            const toggle = document.getElementById('a11yToggle');
            const panel = document.getElementById('a11yPanel');
            const fontIncrease = document.getElementById('fontIncrease');
            const fontDecrease = document.getElementById('fontDecrease');
            const contrastToggle = document.getElementById('contrastToggle');

            let fontSize = parseInt(localStorage.getItem('a11y-fontSize')) || 100;
            let highContrast = localStorage.getItem('a11y-contrast') === 'true';

            function applySettings() {
                document.documentElement.style.fontSize = fontSize + '%';
                document.body.classList.toggle('high-contrast', highContrast);
            }
            applySettings();

            toggle.addEventListener('click', () => {
                const isActive = panel.classList.toggle('active');
                panel.setAttribute('aria-hidden', String(!isActive));
            });

            fontIncrease.addEventListener('click', () => {
                fontSize = Math.min(fontSize + 10, 150);
                localStorage.setItem('a11y-fontSize', fontSize);
                applySettings();
            });

            fontDecrease.addEventListener('click', () => {
                fontSize = Math.max(fontSize - 10, 80);
                localStorage.setItem('a11y-fontSize', fontSize);
                applySettings();
            });

            contrastToggle.addEventListener('click', () => {
                highContrast = !highContrast;
                localStorage.setItem('a11y-contrast', highContrast);
                applySettings();
            });
        })();
    </script>

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js").catch(() => {});
        }
    </script>

    <!-- Tawk.to -->
    <script type="text/javascript">
    var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
    (async function(){
        try {
            if (typeof sb !== "undefined") {
                const { data: { session } } = await sb.auth.getSession();
                if (session && session.user) {
                    const meta = session.user.user_metadata || {};
                    Tawk_API.visitor = {
                        name: (meta.prenom && meta.nom) ? `${meta.prenom} ${meta.nom}` : session.user.email,
                        email: session.user.email
                    };
                }
            }
        } catch (e) {}
    })();
    (function(){
    var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
    s1.async=true;
    s1.src='https://embed.tawk.to/6adca14d64a87f34797a15fb/1k5mtc5ur';
    s1.charset='UTF-8';
    s1.setAttribute('crossorigin','*');
    s0.parentNode.insertBefore(s1,s0);
    })();
    </script>
</body>
</html>
