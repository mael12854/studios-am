<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nos films - Les studios a&amp;m</title>
    <link rel="icon" type="image/jpeg" href="unnamed.jpg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6EA9FB">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #6EA9FB; /* Votre Couleur */
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 2rem;
        }

        .logo {
            width: 180px;
            height: auto;
            border-radius: 8px;
            margin: 1rem 0;
        }

        .poster {
            width: 220px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            margin: 1rem 0;
        }

        .film-card {
            background-color: rgba(255, 255, 255, 0.85);
            max-width: 500px;
            margin: 1.5rem auto;
            padding: 1.5rem;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            text-align: left;
        }

        .film-card h2 {
            text-align: center;
        }

        a {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.6rem 1.2rem;
            background-color: #ffffff;
            color: #333;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        a:hover {
            background-color: #e0e0e0;
        }

        #a11y-widget {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1000;
            text-align: left;
        }

        #a11yToggle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: #ffffff;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        #a11yPanel {
            display: none;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 0.5rem;
            background: white;
            padding: 0.75rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            width: 160px;
        }

        #a11yPanel.active {
            display: flex;
        }

        #a11yPanel button {
            padding: 0.4rem 0.6rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #f5f5f5;
            cursor: pointer;
            font-size: 0.9rem;
        }

        #a11yPanel button:hover {
            background: #e0e0e0;
        }

        body.high-contrast {
            background-color: #000000 !important;
            color: #ffffff !important;
        }

        body.high-contrast a,
        body.high-contrast button {
            background-color: #ffffff !important;
            color: #000000 !important;
            border: 2px solid #ffffff !important;
        }

        body.high-contrast .film-card {
            background-color: #1a1a1a !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body>
    <img class="logo" src="unnamed.jpg" alt="Logo des studios a&m">

    <div id="filmsList">
        <p>Chargement...</p>
    </div>

    <a href="accueil.html">Retour à l'accueil</a>

    <div id="a11y-widget">
        <button id="a11yToggle" aria-label="Options d'accessibilité" title="Options d'accessibilité">♿</button>
        <div id="a11yPanel" aria-hidden="true">
            <button id="fontIncrease" aria-label="Agrandir le texte">A+</button>
            <button id="fontDecrease" aria-label="Réduire le texte">A-</button>
            <button id="contrastToggle" aria-label="Activer le contraste élevé">Contraste élevé</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://hcvwbvqkbgtmmjkjfhza.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjdndidnFrYmd0bW1qa2pmaHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTE2OTQsImV4cCI6MjA5OTE2NzY5NH0.0xEC7Ws9edaUkTDxfC_wvvGBjCbl9Y26VP15vtFsXAQ";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadFilms() {
            const container = document.getElementById("filmsList");

            const { data, error } = await sb
                .from("articles")
                .select("*")
                .eq("category", "film")
                .eq("status", "publie")
                .order("created_at", { ascending: false });

            if (error) {
                container.innerHTML = "<p>⚠️ Impossible de charger les films pour le moment.</p>";
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = "<h2>Rien pour l'instant !</h2>";
                return;
            }

            container.innerHTML = data.map(film => `
                <div class="film-card">
                    ${film.image_url ? `<img class="poster" src="${film.image_url}" alt="Affiche de ${film.title}" style="display:block;margin-left:auto;margin-right:auto;">` : ""}
                    <h2>${film.title}</h2>
                    <p>${film.description ? film.description : ""}</p>
                    ${film.date_representation ? `<p><strong>Date :</strong> ${film.date_representation}</p>` : ""}
                    ${film.prix ? `<p><strong>${film.prix}</strong> la place</p>` : ""}
                </div>
            `).join("");

            data.forEach(film => {
                sb.rpc("increment_views", { article_id: film.id });
            });
        }

        loadFilms();

        (function () {
            const toggle = document.getElementById('a11yToggle');
            const panel = document.getElementById('a11yPanel');
            const fontIncrease = document.getElementById('fontIncrease');
            const fontDecrease = document.getElementById('fontDecrease');
            const contrastToggle = document.getElementById('contrastToggle');

            let fontSize = parseInt(localStorage.getItem('a11y-fontSize')) || 100;
            let highContrast = localStorage.getItem('a11y-contrast') === 'true';

            function applySettings() {
                document.documentElement.style.fontSize = fontSize + '%';
                document.body.classList.toggle('high-contrast', highContrast);
            }
            applySettings();

            toggle.addEventListener('click', () => {
                const isActive = panel.classList.toggle('active');
                panel.setAttribute('aria-hidden', String(!isActive));
            });

            fontIncrease.addEventListener('click', () => {
                fontSize = Math.min(fontSize + 10, 150);
                localStorage.setItem('a11y-fontSize', fontSize);
                applySettings();
            });

            fontDecrease.addEventListener('click', () => {
                fontSize = Math.max(fontSize - 10, 80);
                localStorage.setItem('a11y-fontSize', fontSize);
                applySettings();
            });

            contrastToggle.addEventListener('click', () => {
                highContrast = !highContrast;
                localStorage.setItem('a11y-contrast', highContrast);
                applySettings();
            });
        })();
    </script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js").catch(() => {});
        }
    </script>
</body>
</html>
