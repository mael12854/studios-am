<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation - Les studios a&amp;m</title>
    <link rel="icon" type="image/png" href="icon-192-lumiere.png">
    <link rel="shortcut icon" type="image/png" href="icon-192-lumiere.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F6F1E5">
    <link rel="apple-touch-icon" href="icon-192-lumiere.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="brand.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            text-align: center;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box { max-width: 350px; }

        .box img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: var(--shadow-sm);
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="box card">
        <img src="unnamed.jpg" alt="Logo des studios a&amp;m">
        <p id="message">Confirmation en cours…</p>
    </div>

    <script>
        const SUPABASE_URL = "https://hcvwbvqkbgtmmjkjfhza.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjdndidnFrYmd0bW1qa2pmaHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTE2OTQsImV4cCI6MjA5OTE2NzY5NH0.0xEC7Ws9edaUkTDxfC_wvvGBjCbl9Y26VP15vtFsXAQ";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        (async () => {
            const params = new URLSearchParams(window.location.search);
            const token_hash = params.get("token_hash");
            const type = params.get("type") || "signup";
            const messageEl = document.getElementById("message");

            if (!token_hash) {
                messageEl.textContent = "Lien invalide ou incomplet (paramètre manquant).";
                return;
            }

            try {
                const { data, error } = await sb.auth.verifyOtp({ token_hash, type });

                if (error) {
                    messageEl.innerHTML = escapeHtml(error.message) + "<br><a class='btn btn-primary' href='page_de_connexion.html'>Se connecter</a>";
                } else {
                    const email = data?.user?.email || "";
                    messageEl.innerHTML = `Bienvenue parmi nous${email ? " " + escapeHtml(email) : ""}.<br><a class='btn btn-primary' href='accueil.html'>Continuer</a>`;
                }
            } catch (err) {
                messageEl.textContent = "Erreur inattendue : " + err.message;
            }
        })();

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str ?? "";
            return div.innerHTML;
        }
    </script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js").catch(() => {});
        }
    </script>
</body>
</html>
