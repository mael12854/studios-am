<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Les studios a&amp;m</title>
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="shortcut icon" type="image/png" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6EA9FB">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #6EA9FB; /* Votre Couleur */
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 2rem;
        }

        .logo {
            width: 180px;
            height: auto;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        button.toggle {
            padding: 0.6rem 1.2rem;
            background-color: #ffffff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        button.toggle:hover {
            background-color: #e0e0e0;
        }

        #loginBox {
            position: fixed;
            top: -400px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            transition: top 0.5s;
        }

        #loginBox.active {
            top: 50px;
        }

        #loginBox label {
            display: block;
            text-align: left;
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }

        #loginBox input {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 1rem;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        #loginBox button[type="submit"] {
            width: 100%;
            padding: 0.6rem;
            background-color: #6EA9FB;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        #loginBox button[type="submit"]:hover {
            background-color: #5a94e0;
        }

        #loginBox button[type="submit"]:disabled {
            background-color: #a9c8f5;
            cursor: not-allowed;
        }

        #loginBox .signup-link {
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }

        #loginBox .signup-link a {
            color: #6EA9FB;
        }

        #message {
            font-size: 0.9rem;
            min-height: 1.2rem;
        }

        #a11y-widget {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1000;
            text-align: left;
        }

        #a11yToggle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: #ffffff;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        #a11yPanel {
            display: none;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 0.5rem;
            background: white;
            padding: 0.75rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            width: 160px;
        }

        #a11yPanel.active {
            display: flex;
        }

        #a11yPanel button {
            padding: 0.4rem 0.6rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #f5f5f5;
            cursor: pointer;
            font-size: 0.9rem;
        }

        #a11yPanel button:hover {
            background: #e0e0e0;
        }

        body.high-contrast {
            background-color: #000000 !important;
            color: #ffffff !important;
        }

        body.high-contrast button.toggle {
            background-color: #ffffff !important;
            color: #000000 !important;
            border: 2px solid #ffffff !important;
        }
    </style>
</head>
<body>

    <img class="logo" src="unnamed.jpg" alt="Logo des studios a&m">

    <button class="toggle" onclick="toggleLogin()">Se connecter</button>

    <div id="loginBox">
        <h3>Connexion</h3>

        <form id="loginForm">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="username" required>

            <label for="password">Mot de passe</label>
            <input id="password" type="password" autocomplete="current-password" required>

            <button type="submit" id="submitBtn">Valider</button>
        </form>

        <p id="message" aria-live="polite"></p>

        <p class="signup-link">Pas encore de compte ? <a href="page_inscription.html">Créer un compte</a></p>
    </div>

    <div id="a11y-widget">
        <button id="a11yToggle" aria-label="Options d'accessibilité" title="Options d'accessibilité">♿</button>
        <div id="a11yPanel" aria-hidden="true">
            <button id="fontIncrease" aria-label="Agrandir le texte">A+</button>
            <button id="fontDecrease" aria-label="Réduire le texte">A-</button>
            <button id="contrastToggle" aria-label="Activer le contraste élevé">Contraste élevé</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://hcvwbvqkbgtmmjkjfhza.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjdndidnFrYmd0bW1qa2pmaHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTE2OTQsImV4cCI6MjA5OTE2NzY5NH0.0xEC7Ws9edaUkTDxfC_wvvGBjCbl9Y26VP15vtFsXAQ";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function toggleLogin() {
            document.getElementById("loginBox").classList.toggle("active");
        }

        // Si déjà connecté, aller directement à l'accueil
        (async () => {
            const { data: { session } } = await sb.auth.getSession();
            if (session) window.location.href = "accueil.html";
        })();

        document.getElementById("loginForm").addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const messageEl = document.getElementById("message");
            const submitBtn = document.getElementById("submitBtn");
            const passwordEl = document.getElementById("password");

            submitBtn.disabled = true;
            submitBtn.textContent = "Connexion...";
            messageEl.textContent = "";

            const { error } = await sb.auth.signInWithPassword({ email, password });

            if (error) {
                messageEl.textContent = "❌ " + (error.message === "Invalid login credentials" ? "Identifiants incorrects" : error.message);
                passwordEl.value = "";
                submitBtn.disabled = false;
                submitBtn.textContent = "Valider";
            } else {
                window.location.href = "accueil.html";
            }
        });

        (function () {
            const toggle = document.getElementById('a11yToggle');
            const panel = document.getElementById('a11yPanel');
            const fontIncrease = document.getElementById('fontIncrease');
            const fontDecrease = document.getElementById('fontDecrease');
            const contrastToggle = document.getElementById('contrastToggle');

            let fontSize = parseInt(localStorage.getItem('a11y-fontSize')) || 100;
            let highContrast = localStorage.getItem('a11y-contrast') === 'true';

            function applySettings() {
                document.documentElement.style.fontSize = fontSize + '%';
                document.body.classList.toggle('high-contrast', highContrast);
            }
            applySettings();

            toggle.addEventListener('click', () => {
                const isActive = panel.classList.toggle('active');
                panel.setAttribute('aria-hidden', String(!isActive));
            });

            fontIncrease.addEventListener('click', () => {
                fontSize = Math.min(fontSize + 10, 150);
                localStorage.setItem('a11y-fontSize', fontSize);
                applySettings();
            });

            fontDecrease.addEventListener('click', () => {
                fontSize = Math.max(fontSize - 10, 80);
                localStorage.setItem('a11y-fontSize', fontSize);
                applySettings();
            });

            contrastToggle.addEventListener('click', () => {
                highContrast = !highContrast;
                localStorage.setItem('a11y-contrast', highContrast);
                applySettings();
            });
        })();
    </script>

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js").catch(() => {});
        }
    </script>
</body>
</html>
