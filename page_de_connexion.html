<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Les studios a&amp;m</title>
    <link rel="icon" type="image/png" href="icon-192-lumiere.png">
    <link rel="shortcut icon" type="image/png" href="icon-192-lumiere.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F6F1E5">
    <link rel="apple-touch-icon" href="icon-192-lumiere.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="brand.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { text-align: center; }

        .page-logo { margin: 0 auto 1rem; }

        #loginBox {
            position: fixed;
            top: -400px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            padding: 1.5rem;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            transition: top 0.5s;
        }

        #loginBox.active { top: 50px; }

        #loginBox h3 { text-align: center; }

        #loginBox .signup-link {
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }

        #message {
            font-size: 0.9rem;
            min-height: 1.2rem;
        }
    </style>
</head>
<body>

    <img class="page-logo" src="icon-512-lumiere.png" alt="Logo des studios a&amp;m">

    <button class="btn" onclick="toggleLogin()">Se connecter</button>

    <div id="loginBox">
        <h3>Connexion</h3>

        <form id="loginForm">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="username" required>

            <label for="password">Mot de passe</label>
            <input id="password" type="password" autocomplete="current-password" required>

            <button type="submit" id="submitBtn">Valider</button>
        </form>

        <p id="message" aria-live="polite"></p>

        <p class="signup-link">Pas encore de compte ? <a href="page_inscription.html">Créer un compte</a></p>
    </div>

    <div id="a11y-widget">
        <button id="a11yToggle" aria-label="Options d'accessibilité" title="Options d'accessibilité">♿</button>
        <div id="a11yPanel" aria-hidden="true">
            <button id="fontIncrease" aria-label="Agrandir le texte">A+</button>
            <button id="fontDecrease" aria-label="Réduire le texte">A-</button>
            <button id="contrastToggle" aria-label="Activer le contraste élevé">Contraste élevé</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://hcvwbvqkbgtmmjkjfhza.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjdndidnFrYmd0bW1qa2pmaHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTE2OTQsImV4cCI6MjA5OTE2NzY5NH0.0xEC7Ws9edaUkTDxfC_wvvGBjCbl9Y26VP15vtFsXAQ";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function toggleLogin() {
            document.getElementById("loginBox").classList.toggle("active");
        }

        // Si déjà connecté, aller directement à l'accueil
        (async () => {
            const { data: { session } } = await sb.auth.getSession();
            if (session) window.location.href = "accueil.html";
        })();

        document.getElementById("loginForm").addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const messageEl = document.getElementById("message");
            const submitBtn = document.getElementById("submitBtn");
            const passwordEl = document.getElementById("password");

            submitBtn.disabled = true;
            submitBtn.textContent = "Connexion...";
            messageEl.textContent = "";

            const { error } = await sb.auth.signInWithPassword({ email, password });

            if (error) {
                messageEl.textContent = error.message === "Invalid login credentials" ? "Identifiants incorrects." : error.message;
                passwordEl.value = "";
                submitBtn.disabled = false;
                submitBtn.textContent = "Valider";
            } else {
                window.location.href = "accueil.html";
            }
        });

        (function () {
            const toggle = document.getElementById('a11yToggle');
            const panel = document.getElementById('a11yPanel');
            const fontIncrease = document.getElementById('fontIncrease');
            const fontDecrease = document.getElementById('fontDecrease');
            const contrastToggle = document.getElementById('contrastToggle');

            let fontSize = parseInt(localStorage.getItem('a11y-fontSize')) || 100;
            let highContrast = localStorage.getItem('a11y-contrast') === 'true';

            function applySettings() {
                document.documentElement.style.fontSize = fontSize + '%';
                document.body.classList.toggle('high-contrast', highContrast);
            }
            applySettings();

            toggle.addEventListener('click', () => {
                const isActive = panel.classList.toggle('active');
                panel.setAttribute('aria-hidden', String(!isActive));
            });

            fontIncrease.addEventListener('click', () => {
                fontSize = Math.min(fontSize + 10, 150);
                localStorage.setItem('a11y-fontSize', fontSize);
                applySettings();
            });

            fontDecrease.addEventListener('click', () => {
                fontSize = Math.max(fontSize - 10, 80);
                localStorage.setItem('a11y-fontSize', fontSize);
                applySettings();
            });

            contrastToggle.addEventListener('click', () => {
                highContrast = !highContrast;
                localStorage.setItem('a11y-contrast', highContrast);
                applySettings();
            });
        })();
    </script>

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js").catch(() => {});
        }
    </script>
</body>
</html>
