<!DOCTYPE html>
<html lang="fr" data-theme="nuit">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Cellule Cinéma - Les studios a&amp;m</title>
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="shortcut icon" type="image/png" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#161513">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="brand.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { text-align: center; padding: 2rem 1rem; }

        .page-logo { margin-left: auto; margin-right: auto; }

        .eyebrow {
            font-family: var(--font-mono);
            font-size: .78rem;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--gold);
            margin: 1.5rem 0 .25rem;
        }

        h1 { margin: 0 0 1.5rem; font-size: 1.6rem; }

        .player-wrap {
            max-width: 46rem;
            margin: 0 auto 1.5rem;
        }

        video {
            width: 100%;
            max-height: 70vh;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            background: #000;
            display: block;
        }

        .empty-hint { margin: 2rem auto; }
    </style>
</head>
<body>
    <img class="page-logo" src="icon-512.png" alt="Logo des studios a&amp;m">

    <p class="eyebrow">Cellule Cinéma</p>
    <h1 id="filmTitle">Chargement...</h1>

    <div class="player-wrap" id="playerWrap"></div>

    <a class="btn back" href="films.html">Retour aux films</a>

    <div id="a11y-widget">
        <button id="a11yToggle" aria-label="Options d'accessibilité" title="Options d'accessibilité">♿</button>
        <div id="a11yPanel" aria-hidden="true">
            <button id="fontIncrease" aria-label="Agrandir le texte">A+</button>
            <button id="fontDecrease" aria-label="Réduire le texte">A-</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://hcvwbvqkbgtmmjkjfhza.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjdndidnFrYmd0bW1qa2pmaHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTE2OTQsImV4cCI6MjA5OTE2NzY5NH0.0xEC7Ws9edaUkTDxfC_wvvGBjCbl9Y26VP15vtFsXAQ";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str ?? "";
            return div.innerHTML;
        }

        async function loadTrailer() {
            const titleEl = document.getElementById("filmTitle");
            const playerWrap = document.getElementById("playerWrap");

            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");

            if (!id) {
                titleEl.textContent = "Bande-annonce introuvable";
                playerWrap.innerHTML = "<p class='empty-hint'>Aucun film indiqué.</p>";
                return;
            }

            const { data: film, error } = await sb
                .from("articles")
                .select("*")
                .eq("id", id)
                .single();

            if (error || !film) {
                titleEl.textContent = "Bande-annonce introuvable";
                playerWrap.innerHTML = "<p class='empty-hint'>Ce film n'existe pas ou n'est plus disponible.</p>";
                return;
            }

            titleEl.textContent = film.title;

            if (!film.trailer_url) {
                playerWrap.innerHTML = "<p class='empty-hint'>Aucune bande-annonce n'est disponible pour ce film pour l'instant.</p>";
                return;
            }

            const posterAttr = film.image_url ? ` poster="${escapeHtml(film.image_url)}"` : "";
            playerWrap.innerHTML = `<video controls${posterAttr}><source src="${escapeHtml(film.trailer_url)}">Ton navigateur ne supporte pas la lecture vidéo.</video>`;
        }

        loadTrailer();

        (function () {
            const toggle = document.getElementById('a11yToggle');
            const panel = document.getElementById('a11yPanel');
            const fontIncrease = document.getElementById('fontIncrease');
            const fontDecrease = document.getElementById('fontDecrease');

            let fontSize = parseInt(localStorage.getItem('a11y-fontSize')) || 100;

            // Pas de contraste élevé ici : la page est déjà en thème sombre (Nuit).
            function applySettings() {
                document.documentElement.style.fontSize = fontSize + '%';
            }
            applySettings();

            toggle.addEventListener('click', () => {
                const isActive = panel.classList.toggle('active');
                panel.setAttribute('aria-hidden', String(!isActive));
            });

            fontIncrease.addEventListener('click', () => {
                fontSize = Math.min(fontSize + 10, 150);
                localStorage.setItem('a11y-fontSize', fontSize);
                applySettings();
            });

            fontDecrease.addEventListener('click', () => {
                fontSize = Math.max(fontSize - 10, 80);
                localStorage.setItem('a11y-fontSize', fontSize);
                applySettings();
            });
        })();
    </script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js").catch(() => {});
        }
    </script>

    <!-- Tawk.to -->
    <script type="text/javascript">
    var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
    (async function(){
        try {
            if (typeof sb !== "undefined") {
                const { data: { session } } = await sb.auth.getSession();
                if (session && session.user) {
                    const meta = session.user.user_metadata || {};
                    Tawk_API.visitor = {
                        name: (meta.prenom && meta.nom) ? `${meta.prenom} ${meta.nom}` : session.user.email,
                        email: session.user.email
                    };
                }
            }
        } catch (e) {}
    })();
    (function(){
    var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
    s1.async=true;
    s1.src='https://embed.tawk.to/6adca14d64a87f34797a15fb/1k5mtc5ur';
    s1.charset='UTF-8';
    s1.setAttribute('crossorigin','*');
    s0.parentNode.insertBefore(s1,s0);
    })();
    </script>
</body>
</html>
