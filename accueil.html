<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - Les studios a&amp;m</title>
    <link rel="icon" type="image/jpeg" href="unnamed.jpg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6EA9FB">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #6EA9FB; /* Votre Couleur */
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 2rem;
        }

        img {
            width: 180px;
            height: auto;
            border-radius: 8px;
            margin: 1rem 0;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        nav a {
            padding: 0.6rem 1.2rem;
            background-color: #ffffff;
            color: #333;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        nav a:hover {
            background-color: #e0e0e0;
        }

        button {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            background-color: #ffffff;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #e0e0e0;
        }

        #a11y-widget {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1000;
            text-align: left;
        }

        #a11yToggle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: #ffffff;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        #a11yPanel {
            display: none;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 0.5rem;
            background: white;
            padding: 0.75rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            width: 160px;
        }

        #a11yPanel.active {
            display: flex;
        }

        #a11yPanel button {
            padding: 0.4rem 0.6rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #f5f5f5;
            cursor: pointer;
            font-size: 0.9rem;
        }

        #a11yPanel button:hover {
            background: #e0e0e0;
        }

        body.high-contrast {
            background-color: #000000 !important;
            color: #ffffff !important;
        }

        body.high-contrast a,
        body.high-contrast button {
            background-color: #ffffff !important;
            color: #000000 !important;
            border: 2px solid #ffffff !important;
        }
    </style>
</head>
<body>
    <button onclick="logout()">Se déconnecter</button>

    <h1 id="welcome">Bienvenue</h1>

    <img src="unnamed.jpg" alt="Image de présentation des studios a&m">

    <nav>
        <a href="films.html">Nos films</a>
        <a href="films_en_prevision.html">Films en prévision 🤫🤫</a>
        <a href="pieces_de_theatre.html">Nos pièces de théâtre</a>
        <a href="pieces_de_theatre_en_prevision.html">Pièces de théâtre en prévision 🤫🤫</a>
        <a href="chat.html">💬 Discuter avec les créateurs<span id="unreadBadge" style="display:none; background:#e05a5a; color:white; border-radius:10px; padding:0.1rem 0.5rem; font-size:0.75rem; margin-left:0.4rem;"></span></a>
        <a href="documents_officiels.html">📄 Documents officiels</a>
    </nav>

    <div id="a11y-widget">
        <button id="a11yToggle" aria-label="Options d'accessibilité" title="Options d'accessibilité">♿</button>
        <div id="a11yPanel" aria-hidden="true">
            <button id="fontIncrease" aria-label="Agrandir le texte">A+</button>
            <button id="fontDecrease" aria-label="Réduire le texte">A-</button>
            <button id="contrastToggle" aria-label="Activer le contraste élevé">Contraste élevé</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://hcvwbvqkbgtmmjkjfhza.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjdndidnFrYmd0bW1qa2pmaHphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTE2OTQsImV4cCI6MjA5OTE2NzY5NH0.0xEC7Ws9edaUkTDxfC_wvvGBjCbl9Y26VP15vtFsXAQ";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        (async () => {
            const { data: { session } } = await sb.auth.getSession();

            if (!session) {
                window.location.href = "index.html";
                return;
            }

            document.getElementById("welcome").innerText = "Bienvenue " + session.user.email;

            const { count } = await sb
                .from("messages")
                .select("*", { count: "exact", head: true })
                .eq("user_id", session.user.id)
                .eq("sender", "admin")
                .eq("read", false);

            if (count > 0) {
                const badge = document.getElementById("unreadBadge");
                badge.textContent = count;
                badge.style.display = "inline-block";
            }
        })();

        async function logout() {
            await sb.auth.signOut();
            window.location.href = "index.html";
        }

        (function () {
            const toggle = document.getElementById('a11yToggle');
            const panel = document.getElementById('a11yPanel');
            const fontIncrease = document.getElementById('fontIncrease');
            const fontDecrease = document.getElementById('fontDecrease');
            const contrastToggle = document.getElementById('contrastToggle');

            let fontSize = parseInt(localStorage.getItem('a11y-fontSize')) || 100;
            let highContrast = localStorage.getItem('a11y-contrast') === 'true';

            function applySettings() {
                document.documentElement.style.fontSize = fontSize + '%';
                document.body.classList.toggle('high-contrast', highContrast);
            }
            applySettings();

            toggle.addEventListener('click', () => {
                const isActive = panel.classList.toggle('active');
                panel.setAttribute('aria-hidden', String(!isActive));
            });

            fontIncrease.addEventListener('click', () => {
                fontSize = Math.min(fontSize + 10, 150);
                localStorage.setItem('a11y-fontSize', fontSize);
                applySettings();
            });

            fontDecrease.addEventListener('click', () => {
                fontSize = Math.max(fontSize - 10, 80);
                localStorage.setItem('a11y-fontSize', fontSize);
                applySettings();
            });

            contrastToggle.addEventListener('click', () => {
                highContrast = !highContrast;
                localStorage.setItem('a11y-contrast', highContrast);
                applySettings();
            });
        })();
    </script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js").catch(() => {});
        }
    </script>
</body>
</html>
